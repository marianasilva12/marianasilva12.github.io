function friendQuest(){
  const wk=ensureLeague().week;
  if(!S.friend||S.friend.week!==wk){ S.friend={week:wk,claimed:false}; save(); }
  const me=S.league.xp, capi=Math.round(FRIEND_GOAL*0.55*Math.pow(weekProgress(),0.9));
  return {me,capi,total:Math.min(FRIEND_GOAL,me+capi),full:me+capi>=FRIEND_GOAL,claimed:S.friend.claimed};
}
function untilMidnight(){ const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);const mins=Math.ceil((m-n)/60000);return mins>=60?`${Math.floor(mins/60)} h ${mins%60} min`:`${mins} min`; }

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[’]/g,"'").replace(/[.,!?;:—"]/g,' ').replace(/\s+/g,' ').trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ===================== VOZ ===================== */
const LOCAL_TTS = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance!=='undefined';
let TTS = LOCAL_TTS;   // vira true também quando o servidor tem a voz do Google
const ACCENTS=[['en-US','Americano'],['en-GB','Britânico'],['en-AU','Australiano'],['en-IN','Indiano'],['en','Qualquer']];
function enVoices(){ try{ return speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang)); }catch(e){ return []; } }
function voiceScore(v){
  const acc=(S.accent||'en-US').toLowerCase(), lang=v.lang.toLowerCase().replace('_','-'); let sc=0;
  if(acc!=='en' && lang.startsWith(acc)) sc+=60; if(lang==='en-us') sc+=8;
  if(/natural|neural|online/i.test(v.name)) sc+=45; if(/google/i.test(v.name)) sc+=35; if(/premium|enhanced|siri/i.test(v.name)) sc+=30;
  if(/samantha|aria|jenny|guy|ava|allison|daniel|serena|karen|libby|sonia|ryan|natasha|william|emma|brian|andrew/i.test(v.name)) sc+=12;
  if(/novelty|bad news|bells|bubbles|cellos|whisper|zarvox|trinoids|albert|jester|organ|superstar|wobble|boing|bahh|deranged|hysterical|good news|pipe/i.test(v.name)) sc-=200;
  if(v.localService===false) sc+=4; return sc;
}
const NATURAL_RE=/natural|neural|online|google|premium|enhanced|aprimorad|siri/i;
const isNatural=v=>NATURAL_RE.test(v.name);
function naturalVoices(){ return enVoices().filter(isNatural); }
function pickVoice(){
  const vs=enVoices(); if(!vs.length) return null;
  const chosen=S.voice&&vs.find(v=>v.voiceURI===S.voice); if(chosen) return chosen;
  const nat=naturalVoices(); const pool=(S.natural!==false&&nat.length)?nat:vs;
  return pool.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0];
}
/* controle de áudio: tudo que estiver agendado é cancelado ao trocar de exercício */
let speechTimers=[], slowRun=0;
function sched(fn,ms){ const id=setTimeout(()=>{ speechTimers=speechTimers.filter(x=>x!==id); fn(); },ms); speechTimers.push(id); return id; }
/* ---- voz do Google (servidor) ---- */
/* Um único elemento de áudio, "destravado" no primeiro toque: assim o iPhone e o Chrome
   deixam tocar depois, mesmo quando o áudio começa sozinho ao abrir um exercício. */
const audioEl=(typeof Audio!=='undefined')?new Audio():null;
const SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
let audioUnlocked=false;
function unlockAudio(){ if(audioUnlocked||!audioEl) return; audioUnlocked=true; try{ audioEl.muted=true; audioEl.src=SILENT; const p=audioEl.play(); const back=()=>{ audioEl.muted=false; }; if(p&&p.then) p.then(back,back); else back(); }catch(e){ audioEl.muted=false; } }
try{ ['pointerdown','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{once:true,capture:true})); }catch(e){}
const cloudOn=()=>serverOn&&serverCloud&&S.cloudVoice!==false&&!!audioEl&&Date.now()>cloudPausedUntil;
let cloudPausedUntil=0, cloudFails=0, cloudWarned=false, playToken=0;
function cloudUrl(t,rate){ const acc=(S.accent&&S.accent!=='en')?S.accent:'en-US'; const v=serverVoices.some(x=>x.id===S.serverVoice)?S.serverVoice:''; return `${API_BASE}/tts?accent=${encodeURIComponent(acc)}&rate=${Math.round(rate*100)/100}${v?`&voice=${encodeURIComponent(v)}`:''}&text=${encodeURIComponent(t)}`; }
/* baixa o áudio uma vez e guarda (também serve para pré-carregar o próximo exercício) */
const audioCache=new Map();
function fetchCloud(url){
  if(audioCache.has(url)) return audioCache.get(url);
  const p=fetch(url).then(async r=>{ if(!r.ok){ let d=''; try{ d=(await r.json()).detail||''; }catch(e){} throw new Error(d||('erro '+r.status)); } return URL.createObjectURL(await r.blob()); });
  audioCache.set(url,p); p.catch(()=>audioCache.delete(url));
  if(audioCache.size>300){ const k=audioCache.keys().next().value; const old=audioCache.get(k); audioCache.delete(k); old.then(u=>URL.revokeObjectURL(u)).catch(()=>{}); }
  return p;
}
function prefetchCloud(t,rate){ if(cloudOn()&&t) fetchCloud(cloudUrl(t,rate||(S.rate||1))).catch(()=>{}); }
function stopCloud(){ playToken++; if(audioEl){ try{ audioEl.onended=audioEl.onerror=null; audioEl.pause(); }catch(e){} } }
function cloudFailed(err){
  if(++cloudFails>=3){ cloudPausedUntil=Date.now()+60000; cloudFails=0; }
  if(!cloudWarned){ cloudWarned=true; toast(`${I.sound}Voz do servidor falhou${err&&err.message?': '+esc(err.message):''}. Usando a voz do aparelho por enquanto.`); }
}
function playCloud(t,rate,onEnd,onFail){
  stopCloud(); const tok=playToken; let done=false;
  const end=()=>{ if(done||tok!==playToken) return; done=true; onEnd&&onEnd(); };
  const fail=err=>{ if(done||tok!==playToken) return; done=true; cloudFailed(err); (onFail||onEnd)&&(onFail||onEnd)(); };
  fetchCloud(cloudUrl(t,rate)).then(src=>{
    if(tok!==playToken) return;
    cloudFails=0; audioEl.muted=false; audioEl.onended=end; audioEl.onerror=()=>fail(new Error('não foi possível tocar o áudio'));
    audioEl.src=src; const p=audioEl.play(); if(p&&p.catch) p.catch(e=>fail(new Error(e&&e.name==='NotAllowedError'?'o navegador bloqueou o som; toque na tela e tente de novo':'não foi possível tocar o áudio')));
  }).catch(fail);
}
/* fala uma frase curta (nuvem ou aparelho) e avisa quando acabar */
function sayOne(text,rate,onEnd){
  if(cloudOn()) return playCloud(text,rate,onEnd,()=>sayLocal(text,rate,onEnd));
  sayLocal(text,rate,onEnd);
}
function sayLocal(text,rate,onEnd){
  let done=false; const go=()=>{ if(done) return; done=true; onEnd&&onEnd(); };
  if(!LOCAL_TTS){ go(); return; }
  try{ const v=pickVoice(), u=new SpeechSynthesisUtterance(text); u.lang=v?v.lang:'en-US'; if(v) u.voice=v; u.rate=Math.max(0.4,Math.min(1.6,rate));
    u.onend=go; u.onerror=go; sched(go,1500+text.length*140); speechSynthesis.speak(u); }catch(e){ go(); }
}
function stopSpeech(){ speechTimers.forEach(clearTimeout); speechTimers=[]; slowRun++; pendingSpeech=null; stopCloud(); try{ if(LOCAL_TTS) speechSynthesis.cancel(); }catch(e){} }
/* espera as vozes carregarem antes de falar, para nunca usar a voz em português */
let voicesReady=false, pendingSpeech=null;
function whenVoices(fn){
  if(cloudOn()||!LOCAL_TTS){ fn(); return; }
  if(voicesReady||enVoices().length){ voicesReady=true; fn(); return; }
  pendingSpeech=fn; sched(()=>{ if(pendingSpeech===fn){ pendingSpeech=null; fn(); } },900);
}
if(LOCAL_TTS){ try{ speechSynthesis.addEventListener('voiceschanged',()=>{ if(enVoices().length){ voicesReady=true; if(pendingSpeech){ const f=pendingSpeech; pendingSpeech=null; f(); } } }); speechSynthesis.getVoices(); }catch(e){} }
/* Fala lenta: uma palavra por vez, com pausa entre elas */
function speakSlow(t,onWord){
  if(!TTS||!t) return; const run=++slowRun;
  stopCloud(); try{ if(LOCAL_TTS) speechSynthesis.cancel(); }catch(e){}
  const words=t.replace(/[.,!?;:]/g,'').split(/\s+/).filter(Boolean);
  const next=i=>{ if(run!==slowRun) return; if(i>=words.length){ onWord&&onWord(-1); return; }
    onWord&&onWord(i);
    sayOne(words[i], cloudOn()?0.75:Math.max(0.4,0.6*(S.rate||1)), ()=>sched(()=>next(i+1),380)); };
  whenVoices(()=>next(0));
}
let warnedNoVoice=false;
/* explica por que a voz do servidor não está sendo usada */
function voiceProblem(){
  const loc=(typeof location!=='undefined')?location:{port:'',hostname:''};
  if(!serverOn) return loc.port&&loc.port!=='8000'&&/localhost|127\.0\.0\.1/.test(loc.hostname)
    ? `Você abriu o app pela porta ${loc.port}. Abra pelo servidor: http://localhost:8000`
    : 'O servidor do CapiFluent não respondeu. Confira se ele está ligado (python -m app.server).';
  if(!serverCloud) return 'A voz natural não está instalada no servidor. Rode “python tools/setup_voice.py” e reinicie o servidor.';
  if(S.cloudVoice===false) return 'A voz do servidor está desligada. Ligue em Perfil → Voz em inglês.';
  if(Date.now()<=cloudPausedUntil) return 'A voz do servidor falhou agora há pouco. Tentando de novo em 1 minuto.';
  return 'Não encontrei voz em inglês neste aparelho. Veja Perfil → Voz em inglês.';
}
/* fala um texto em inglês; onDone é chamado quando termina (ou falha) */
function speak(t,slow,onDone){
  slowRun++; const fin=()=>{ if(onDone){ const f=onDone; onDone=null; f(); } };
  if(!TTS||!t){ fin(); return; }
  if(cloudOn()){ stopCloud(); try{ if(LOCAL_TTS) speechSynthesis.cancel(); }catch(e){}
    playCloud(t,Math.max(0.5,Math.min(1.5,(S.rate||1)*(slow?0.7:1))),fin,()=>speakLocalNow(t,slow,fin)); return; }
  speakLocalNow(t,slow,fin);
}
function speakLocalNow(t,slow,fin){
  if(!LOCAL_TTS){ fin(); return; }
  whenVoices(()=>{ try{
    const u=new SpeechSynthesisUtterance(t);
    const v=pickVoice(); u.lang=v?v.lang:(S.accent&&S.accent!=='en'?S.accent:'en-US'); if(v) u.voice=v;
    u.rate=Math.max(0.4,Math.min(1.6,(S.rate||1)*(slow?0.62:1))); u.pitch=1; u.volume=1;
    u.onend=fin; u.onerror=fin; setTimeout(fin, 900+t.length*120);
    if(!v && !warnedNoVoice){ warnedNoVoice=true; toast(`${I.sound}${voiceProblem()}`); }
    const go=()=>{ try{ if(speechSynthesis.resume) speechSynthesis.resume(); speechSynthesis.speak(u); }catch(e){ fin(); } };
    // o Chrome às vezes fica mudo se falar logo depois de cancelar: espera um instante
    if(speechSynthesis.speaking||speechSynthesis.pending){ speechSynthesis.cancel(); setTimeout(go,90); } else go();
  }catch(e){ fin(); } });
}

let earSeq=0;
function makeEar(type,set){
  set=set||pick(MINIMAL); earSeq++;
  if(type==='samediff'){
    const same=Math.random()<0.45, a=pick(set), b=same?a:pick(set.filter(w=>w!==a));
    return {id:'ear-sd-'+a[0]+'-'+b[0]+'-'+earSeq,type:'samediff',a:a[0],b:b[0],ipas:[a[1],b[1]],set,answer:same?'Palavras iguais':'Duas palavras diferentes',opts:['Palavras iguais','Duas palavras diferentes']};
  }
  const t=pick(set); return {id:'ear-'+t[0]+'-'+earSeq,type:'sound',answer:t[0],ipa:t[1],opts:set.map(w=>w[0]),set};
}
function speakSeq(list,gap=550){
  if(!TTS) return; const run=++slowRun;
  stopCloud(); try{ if(LOCAL_TTS) speechSynthesis.cancel(); }catch(err){}
  const say=i=>{ if(run!==slowRun||i>=list.length) return; sayOne(list[i],(S.rate||1)*0.95,()=>sched(()=>say(i+1),gap)); };
  whenVoices(()=>say(0));
}
function playPair(e){ speakSeq([e.a,e.b]); }

function drillPool(d,units){
  if(d.id==='say'){ const items=[]; const seen=new Set(); shuffle(units.flatMap(u=>u.say||[])).forEach(it=>{ const k=it[0].toLowerCase(); if(!seen.has(k)){ seen.add(k); items.push(it); } }); return items; }
  const all=units.flatMap(u=>u.ex).filter(e=>!(e.type==='listen'&&!TTS));
  return d.types?all.filter(e=>d.types.includes(e.type)):all;
}
function drillAvailable(d,units){
  if(d.need==='tts'&&!TTS) return 'Precisa de áudio, que este navegador não tem.';

function startDrill(id){
  const d=DRILLS.find(x=>x.id===id); const units=drillUnits(); if(!d||!units.length) return;

function startSounds(focus){

  const pool=shuffle(sets.slice(0,10).map((set,i)=>makeEar(i<6?'sound':'samediff',set)));
  L={mode:'review',kind:'sounds',xp:10,label:'Sons',queue:pool,pos:0,correct:0,errors:0,retried:new Set(),t0:Date.now()};

}

const CAPY_POSES=['orange','phones','book','wave'];
function pathView(){
  const cu=currentUnit();
  const show=bannerUnit?UNITS.find(u=>u.key===bannerUnit):cu;
  let h=`<div class="banner ${doneOf(show.key)>=LESSONS_PER_UNIT?'done':''}" id="banner" style="${sc(show.si)}">${bannerInner(show)}</div>`;
  const base=[0,-34,-58,-34,0,34];
  const lastSi=S.free?STAGES.length-1:Math.max(cu.si,...UNITS.filter(u=>doneOf(u.key)>0).map(u=>u.si));
  STAGES.forEach((st,si)=>{
    if(si>lastSi) return;
    h+=`<div class="stagehead" style="${sc(si)}"><span class="k">${st.lvl}</span><h2>${st.n}</h2><p>Meta: ${st.goal}</p><p class="stagebonus">${I.gem}+${STAGE_BONUS} CapiXP ao concluir a etapa</p></div>`;
    UNITS.filter(u=>u.si===si).forEach(u=>{
      const n=doneOf(u.key), lk=!unlocked(u), sign=u.idx%2?-1:1;
      const slots=[]; for(let i=0;i<LESSONS_PER_UNIT;i++){ if(i===CHEST_AFTER) slots.push('c'); slots.push(i); } slots.push('x');
      h+=`<section class="unitsec" data-u="${u.key}" style="${sc(si)}"><div class="divider">${esc(u.t)}</div><div class="path">
        <div class="decor ${sign>0?'right':'left'}" aria-hidden="true">${capy(CAPY_POSES[u.idx%CAPY_POSES.length],140)}</div>`;
      slots.forEach((i,k)=>{
        const off=(i==='c'?-96:i==='x'?0:base[k%base.length])*sign;
        let node,id;
        if(i==='x'){
          id=u.key+':x'; const ready=!lk&&(n>=LESSONS_PER_UNIT||S.free), best=(S.exams||{})[u.key], passed=best>=EXAM_PASS;
          node=`<button class="node exam ${passed?'passed':ready?'ready':'locked'}" data-node="${id}" aria-label="Prova da unidade">${I.exam}${best!==undefined?`<em>${best}/${EXAM_N}</em>`:''}</button>`;
        } else if(i==='c'){
          id=u.key+':c'; const opened=S.chests.includes(u.key), ready=n>=CHEST_AFTER;
          node=`<button class="node chest ${opened?'opened':ready?'ready':''}" data-node="${id}" aria-label="Baú da unidade">${opened?I.chestOpen:I.chest}</button>`;
        } else {
          id=u.key+':'+i;
          const isDone=i<n, isCur=!lk&&i===n&&u.key===cu.key, avail=!lk&&i<=n, kind=LESSON_KINDS[i];
          const ring=isCur?`<svg class="ring" viewBox="0 0 94 88"><ellipse cx="47" cy="44" rx="44" ry="41" fill="none" stroke="var(--sunk)" stroke-width="7"/><ellipse cx="47" cy="44" rx="44" ry="41" fill="none" stroke="var(--sc)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${Math.max(6,268*n/LESSONS_PER_UNIT)} 400" transform="rotate(-90 47 44)"/></svg>`:'';
          const glyph = isDone ? (kind.icon==='star'?I.check:I[kind.icon]) : I[kind.icon];
          node=`<button class="node ${isDone?'done':''} ${!avail?'locked':''} ${isCur?'current':''}" data-node="${id}" aria-label="${esc(u.t)} · ${kind.name}">${ring}${glyph}</button>`;
        }
        h+=`<div class="slot" style="transform:translateX(${off}px)">${node}</div>`;
        if(openNode===id) h+=popover(u,i,n,lk);
      });
      h+=`</div></section>`;
    });
  });
  if(lastSi<STAGES.length-1){
    const nx=STAGES[lastSi+1];
    h+=`<div class="nextcard" style="${sc(lastSi+1)}"><span class="nc-tag">A seguir</span>
      <h3>${I.lock}Etapa ${lastSi+2} · ${nx.lvl.split('·')[1].trim()}</h3><div class="nc-name">${nx.n}</div>
      <p>${esc(nx.topics.slice(0,3).join(', '))} e mais. Meta: ${esc(nx.goal)}</p>
      <button class="btn alt" data-skipto="${lastSi+1}">Pular para cá?</button>
      <div class="small" style="margin-top:10px">Faça um teste com ${JUMP_EX} exercícios da etapa atual. Você pode errar até ${MAX_JUMP_ERR}.</div></div>`;
    if(lastSi+2<STAGES.length) h+=`<div class="later">${STAGES.slice(lastSi+2).map((st,k)=>`<div class="later-row" style="${sc(lastSi+2+k)}">${I.lock}<span>Etapa ${lastSi+3+k} · ${st.n}</span><em>${st.lvl.split('·')[1].trim()}</em></div>`).join('')}</div>`;
  } else h+=`<p class="muted" style="text-align:center;margin-top:36px;font-size:14px">Novas unidades serão adicionadas conforme o curso cresce.</p>`;
  h+=`
    <button class="jump" id="jump" data-jump aria-label="Ir para a lição atual" hidden>${I.down}</button>`;
  return h;
}

/* ===================== LIÇÃO ===================== */
let L=null;
/* O Brave tem o objeto de reconhecimento de voz, mas ele não funciona: tratamos como indisponível */
const IS_BRAVE=!!(navigator.brave&&typeof navigator.brave.isBrave==='function');
const SR=IS_BRAVE?null:(window.SpeechRecognition||window.webkitSpeechRecognition||null);
const PAUSE_MS=15*60*1000;
const speakAllowed=()=>!!SR && !((S.noSpeakUntil||0)>Date.now());
const listenAllowed=()=>TTS && !((S.noListenUntil||0)>Date.now());
function lev(a,b){ const m=a.length,n=b.length; if(!m||!n) return Math.max(m,n); let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }
function speechMatch(heard,target){
  const h=norm(heard).replace(/'/g,''), t=norm(target).replace(/'/g,''); if(!h) return false;
  if(h===t||(' '+h+' ').includes(' '+t+' ')) return true;
  return 1-lev(h,t)/Math.max(h.length,t.length)>=0.75;
}
function setSayMsg(c,text,err){ c.liveMsg=text; c.liveErr=!!err; const el=app.querySelector('.saymsg'); if(el&&L&&L.cur===c){ el.textContent=text; el.classList.toggle('err',!!err); } }
function startMic(){
  const c=L.cur; if(!c||c.listening||c.checked) return;
  stopSpeech();
  let r; try{ r=new SR(); }catch(err){ c.micErr='O reconhecimento de voz não funciona neste navegador. Use o Chrome ou o Edge.'; drawLesson(); return; }
  const it=c.items[c.idx];
  r.lang=(S.accent&&S.accent!=='en')?S.accent:'en-US'; r.interimResults=true; r.maxAlternatives=5; r.continuous=false;
  c.listening=true; c.micErr=''; c.heard=''; c.flash=''; c.liveMsg='Abrindo o microfone…'; c.liveErr=false;
  let gotAudio=false, gotSpeech=false, done=false;
  drawLesson();
  r.onaudiostart=()=>{ gotAudio=true; setSayMsg(c,'Microfone ligado. Fale agora: diga a palavra em inglês.'); };
  r.onspeechstart=()=>{ gotSpeech=true; setSayMsg(c,'Estou ouvindo sua voz…'); };
  r.onresult=ev=>{
    if(L.cur!==c||done) return;
    const res=ev.results[ev.results.length-1], alts=[...res].map(a=>a.transcript.trim());
    c.heard=alts[0]||''; const h=app.querySelector('.saycard .heard'); 
    if(h) h.textContent=`Ouvindo: “${c.heard}”`; else { const card=app.querySelector('.saycard'); if(card){ const sp=document.createElement('span'); sp.className='heard'; sp.textContent=`Ouvindo: “${c.heard}”`; card.insertBefore(sp,card.querySelector('.saycount')); } }
    if(alts.some(a=>speechMatch(a,it[0]))){ done=true; try{r.abort()}catch(e){} sayGood(c); return; }
    if(res.isFinal){ done=true; sayBad(c); }
  };
  r.onerror=ev=>{ if(L.cur!==c||done) return; done=true; c.listening=false;
    c.micErr=(ev.error==='not-allowed'||ev.error==='service-not-allowed')?'O microfone está bloqueado. Clique no cadeado ao lado do endereço, permita o microfone e tente de novo.'
      :ev.error==='network'?'O reconhecimento de voz precisa de internet e só funciona no Chrome ou no Edge. Confira sua conexão.'
      :ev.error==='audio-capture'?'Nenhum microfone encontrado. Conecte um microfone e tente de novo.'
      :ev.error==='no-speech'?(gotAudio?'O microfone ligou, mas não ouviu sua voz. Fale mais alto ou confira se o microfone certo está escolhido (ícone de microfone na barra de endereço).':'Não ouvi nada. Tente de novo, mais perto do microfone.')
      :ev.error==='aborted'?'':'Não consegui ouvir. Tente de novo.';
    drawLesson(); };
  r.onend=()=>{ if(!L||L.cur!==c||done) return; done=true; c.listening=false;
    if(c.heard){ if(speechMatch(c.heard,it[0])) return sayGood(c); return sayBad(c); }
    c.micErr=!gotAudio?'O navegador não conseguiu abrir o microfone. No Windows, confira em Configurações → Privacidade → Microfone se o navegador tem permissão.'
      :!gotSpeech?'O microfone ligou, mas não captou sua voz. Confira se o microfone certo está escolhido no navegador e fale um pouco mais alto.'
      :'Não entendi a palavra. Tente falar mais devagar e claro.';
    drawLesson(); };
  try{ r.start(); c.rec=r; }catch(err){ c.listening=false; c.micErr='Não foi possível usar o microfone.'; drawLesson(); }
}
function checkTyped(c,val){
  const it=c.items[c.idx]; if(!val.trim()) return;
  c.heard=val.trim(); c.typing=false;
  if(norm(val).replace(/'/g,'')===norm(it[0]).replace(/'/g,'')) sayGood(c); else sayBad(c);
}
function sayGood(c){ c.listening=false; c.results[c.idx]='ok'; c.flash='good'; speak(c.items[c.idx][0]); drawLesson(); setTimeout(()=>advanceSay(c),900); }
function sayBad(c){ c.listening=false; c.attempts++; c.flash='bad';
  if(c.attempts>=3){ c.results[c.idx]='miss'; c.reveal=true; speak(c.items[c.idx][0]); drawLesson(); setTimeout(()=>advanceSay(c),2200); }
  else drawLesson(); }
function advanceSay(c){ if(!L||L.cur!==c) return; c.idx++; c.flash=''; c.heard=''; c.attempts=0; c.reveal=false; c.micErr='';
  if(c.idx>=c.items.length) check(); else drawLesson(); }
function waveOn(ms){ const w=app.querySelector('.wave'); if(!w) return; w.classList.add('playing'); clearTimeout(waveOn.t); waveOn.t=setTimeout(()=>w.classList.remove('playing'),ms); }
const estMs=t=>Math.max(900,t.split(/\s+/).length*420+500)/Math.max(.5,(S.rate||1));
const SAY_WORDS=10;
/* 10 palavras para repetir: primeiro as da unidade, depois as já estudadas, e por fim as das próximas unidades */
function sayItems(u,n){
  const groups=[shuffle(u.say||[]), shuffle(UNITS.slice(0,u.idx).flatMap(x=>x.say||[])), shuffle(UNITS.slice(u.idx+1,u.idx+4).flatMap(x=>x.say||[]))];
  const seen=new Set(), out=[];
  for(const it of groups.flat()){ const k=it[0].toLowerCase(); if(seen.has(k)) continue; seen.add(k); out.push(it); if(out.length>=n) break; }
  return out;
}

const EXAM_N=10, EXAM_PASS=8, EXAM_XP=20, EXAM_GEMS=15;
function startExam(key){
  const u=UNITS.find(x=>x.key===key); if(!u) return;
  const fromUnit=x=>x.ex.filter(e=>(e.type==='build'||e.type==='listen')&&e.en&&e.pt).map(e=>({en:e.en,pt:e.pt,extra:e.extra||[],unit:x.key}));
  const own=shuffle(fromUnit(u)), prev=shuffle(UNITS.slice(Math.max(0,u.idx-2),u.idx).flatMap(fromUnit));
  const sentences=[...own,...prev]; if(!sentences.length) return;
  const plan=TTS?['build','rev','listen','revAudio','build','rev','listen','revAudio','build','rev']:['build','rev','build','rev','build','rev','build','rev','build','rev'];
  const queue=plan.map((kind,k)=>{ const s0=sentences[k%sentences.length], id='exam-'+key+'-'+k;
    if(kind==='build') return {id,type:'build',pt:s0.pt,en:s0.en,extra:s0.extra,unit:s0.unit,answer:s0.en};
    if(kind==='listen') return {id,type:'listen',en:s0.en,pt:s0.pt,unit:s0.unit,answer:s0.en};
    return {id,type:'rev',en:s0.en,pt:s0.pt,unit:s0.unit,answer:s0.pt,audioOnly:kind==='revAudio'}; });
  L={mode:'exam',unitKey:key,label:'Prova',queue:shuffle(queue),pos:0,correct:0,errors:0,retried:new Set(),t0:Date.now()};
  nextEx();
}

  S.exams[key]=Math.max(S.exams[key]||0,score);

  if(firstPass){ S.gems+=EXAM_GEMS; logEvent('trophy',`Passou na prova de “${u.t}” com ${score}/${EXAM_N}!`); }

      <div class="tile" style="border-color:var(--gem)"><b style="background:var(--gem)">CapiXP</b><span style="color:var(--gem)">${ic('gem',22)} +${firstPass?EXAM_GEMS:0}</span></div></div>
    </div></div>

function startLesson(key,li){
  regen();
  if(S.hearts<=0){ outOfHearts(); return; }
  const u=UNITS.find(x=>x.key===key), n=doneOf(key), practice=li<n;
  const prev=UNITS.slice(Math.max(0,u.idx-3),u.idx).flatMap(x=>x.ex);
  const take=list=>{ let r=list.filter((e,j,a)=>a.indexOf(e)===j).slice(0,EX_PER_LESSON);
    if(r.length<EX_PER_LESSON) r=r.concat(shuffle(prev.filter(e=>!r.includes(e))).slice(0,EX_PER_LESSON-r.length));
    while(r.length<EX_PER_LESSON) r.push(pick(u.ex)); return shuffle(r); };
  const voc=u.ex.filter(e=>e.type==='pairs'||e.type==='mc'||e.type==='build'||e.type==='rev');
  const aud=u.ex.filter(e=>e.type==='listen'||e.type==='rev'||e.type==='pairs');
  let pool;
  if(li===0) pool=take(shuffle(u.ex));
  else if(li===1) pool=take([...shuffle(voc),...shuffle(u.ex)]);
  else if(li===2) pool=take([...shuffle(u.ex).slice(0,7),...shuffle(prev).slice(0,3),...shuffle(u.ex)]);
  else if(li===3) pool=take([...shuffle(aud),...(TTS?shuffle(prev.filter(e=>e.type==='listen')).slice(0,2):[]),...shuffle(u.ex)]);
  else pool=take([...shuffle(u.ex).slice(0,8),...shuffle(prev).slice(0,2),...shuffle(u.ex)]);

function startReview(kind){

function bindLesson(){
  const c=L.cur, q=s=>app.querySelectorAll(s);
  app.querySelector('[data-quit]').onclick=()=>{logTime();L=null;stopSpeech();render()};
  if(!c.checked){
    q('[data-opt]').forEach(b=>b.onclick=()=>{c.sel=c.opts[+b.dataset.opt];if(optsAreEnglish(c))speak(c.sel.replace(/\(.*?\)/g,''));drawLesson()});
    q('[data-unsel]').forEach(b=>b.onclick=()=>{c.sel=null;drawLesson()});
    q('[data-sayw]').forEach(b=>b.onclick=()=>speak(b.dataset.sayw));
    q('[data-slowsnd]').forEach(b=>b.onclick=()=>{ stopSpeech(); sayOne(c.e.answer,0.6); });
    q('[data-build]').forEach(b=>b.onclick=()=>{const it=c.bank.find(x=>x.i===+b.dataset.build);c.built.push(it);if(c.type!=='rev')speak(it.w);drawLesson()});
    q('[data-word]').forEach(b=>b.onclick=()=>speak(b.dataset.word.replace(/[.,!?]/g,'')));
    q('[data-skip]').forEach(b=>b.onclick=()=>{c.skipped=true;check()});
    q('[data-mic]').forEach(b=>b.onclick=()=>{ if(c.listening){ try{c.rec&&c.rec.stop()}catch(err){} } else { c.typing=false; startMic(); } });
    q('[data-typeit]').forEach(b=>b.onclick=()=>{ try{c.rec&&c.rec.abort()}catch(err){} c.listening=false; c.typing=true; c.micErr=''; drawLesson(); const i=app.querySelector('#saytype'); if(i) i.focus(); });
    q('[data-typeform]').forEach(f=>f.onsubmit=ev=>{ ev.preventDefault(); checkTyped(c,f.querySelector('input').value); });
    q('[data-swap]').forEach(b=>b.onclick=()=>{ if(c.items.length-c.idx<2) return; const [it]=c.items.splice(c.idx,1); c.items.push(it); c.heard=''; c.flash=''; c.attempts=0; c.micErr=''; drawLesson(); });
    q('[data-nospeak]').forEach(b=>b.onclick=()=>{ try{c.rec&&c.rec.abort()}catch(err){} S.noSpeakUntil=Date.now()+PAUSE_MS; save(); L.queue=L.queue.filter((x,k)=>k<=L.pos||x.type!=='say'); L.queue.splice(L.pos,1); toast(`${I.mic}Exercícios de fala pausados por 15 minutos`); nextEx(); });
    q('[data-nolisten]').forEach(b=>b.onclick=()=>{ S.noListenUntil=Date.now()+PAUSE_MS; save(); L.queue=L.queue.filter((x,k)=>k<=L.pos||x.type!=='listen'); L.queue.splice(L.pos,1); toast(`${I.sound}Exercícios de escuta pausados por 15 minutos`); nextEx(); });
    q('[data-unbuild]').forEach(b=>b.onclick=()=>{c.built.splice(+b.dataset.unbuild,1);drawLesson()});
    q('[data-say]').forEach(b=>b.onclick=()=>{ speak(c.e.en); waveOn(estMs(c.e.en)); });
    q('.slowlink[data-slow]').forEach(b=>b.onclick=()=>{ const w=app.querySelector('.wave'); if(w) w.classList.add('playing','slow'); speakSlow(c.e.en,i=>{ if(i<0&&w) w.classList.remove('playing','slow'); }); });
    q('[data-slow]:not(.slowlink)').forEach(b=>b.onclick=()=>{ const dots=app.querySelector('.slowdots'); const n=c.e.en.replace(/[.,!?;:]/g,'').split(/\s+/).filter(Boolean).length;
      if(dots) dots.innerHTML=Array.from({length:n},()=>'<i></i>').join('');
      b.classList.add('playing');
      speakSlow(c.e.en,i=>{ if(dots) [...dots.children].forEach((d,k)=>d.className=k<i?'past':k===i?'now':''); if(i<0){ b.classList.remove('playing'); if(dots) [...dots.children].forEach(d=>d.className='past'); } }); });
    q('[data-line]').forEach(b=>b.onclick=()=>speak(c.e.story.text[+b.dataset.line]));
    q('[data-pl]').forEach(b=>b.onclick=()=>pairTap('l',+b.dataset.pl));
    q('[data-pr]').forEach(b=>b.onclick=()=>pairTap('r',+b.dataset.pr));
    const ck=app.querySelector('[data-check]'); if(ck) ck.onclick=check;
  } else {
    app.querySelector('[data-next]').onclick=(L.mode==='jump'&&L.errors>MAX_JUMP_ERR)?()=>jumpFail():(L.mode==='lesson'&&S.hearts<=0&&!L.inFix)?()=>{logTime();outOfHearts()}:()=>{L.pos++;nextEx()};
  }
}
function pairTap(side,i){
  const c=L.cur; c.wrong=null;
  if(side==='l') speak(c.e.pairs[i][0]);
  if(!c.pairPick||c.pairPick.side===side){ c.pairPick={side,i}; drawLesson(); return; }
  if(c.pairPick.i===i){ c.matched.add(i); c.pairPick=null; } else { c.wrong=side+i; c.pairPick=null; }
  drawLesson();
  if(c.matched.size===c.e.pairs.length) check();
}
function check(){
  const c=L.cur,e=c.e; if(c.checked) return;
  let ok;
  if(c.type==='read'||c.type==='say') ok=true;
  else if(c.skipped) ok=false;
  else if(c.type==='pairs') ok=true;
  else if(['mc','fill','pattern','pic','sound','samediff'].includes(c.type)) ok=c.sel===e.answer;
  else ok=norm(c.built.map(b=>b.w).join(' '))===norm(c.type==='rev'?e.pt:e.en);
  if(c.type==='read'){ L.pos++; nextEx(); return; }
  c.ok=ok; c.checked=true;
  if(e.type==='samediff'){ S.sounds=S.sounds||{}; if(ok&&!c.fix) e.ipas.forEach(x=>S.sounds[x]=Math.min(5,(S.sounds[x]||0)+1)); }
  if(e.type==='sound'){ S.sounds=S.sounds||{}; if(ok&&!c.fix) S.sounds[e.ipa]=Math.min(5,(S.sounds[e.ipa]||0)+1); speak(e.answer); }
  (L.log=L.log||[]).push({e,ok});
  if(ok&&e.type==='pattern') speak(e.s.replace('___',e.answer));
  if(ok){ L.correct++; day().correct++;
    if(L.mode==='review') S.mistakes=S.mistakes.filter(id=>id!==e.id);
    if(e.type==='build'||e.type==='listen'||e.type==='rev') speak(e.en); else if(e.type==='fill') speak(e.s.replace('___',e.answer).replace(/\(.*?\)/g,'')); }
  else{
    if(!L.inFix) L.errors++;
    if(e.unit && !S.mistakes.includes(e.id)) S.mistakes.push(e.id);
    if(L.mode==='lesson' && !L.inFix){ if(S.hearts===MAX_HEARTS) S.heartsAt=Date.now(); S.hearts=Math.max(0,S.hearts-1); }
    if(L.mode!=='jump'&&L.mode!=='exam'){ if(L.inFix) L.queue.push(e); else { L.fixList=L.fixList||[]; if(!L.fixList.some(x=>x.id===e.id)) L.fixList.push(e); } }
  }
  save(); drawLesson();
}
function award(xp){
  const d=today();
  if(S.lastDay!==d){ S.streak = S.lastDay===yesterday()? S.streak+1 : 1; S.lastDay=d; if(MILESTONES.includes(S.streak)) logEvent('flame',`Chegou a ${S.streak} dias de CapiFogo!`); }
  S.bestStreak=Math.max(S.bestStreak||0,S.streak);
  S.xp+=xp; day().xp+=xp;
  S.hist[d]=(S.hist[d]||0)+xp;
  const keys=Object.keys(S.hist).sort(); while(keys.length>120) delete S.hist[keys.shift()];
  ensureLeague().xp+=xp;
}
/* bônus de velocidade (só nas lições da trilha, com pelo menos 70% de acerto) */
const SPEED_TIERS=[
  {max:90,  name:'Relâmpago', xp:10, gems:5, icon:'bolt'},
  {max:150, name:'Rápido',    xp:5,  gems:3, icon:'flame'},
  {max:240, name:'Bom ritmo', xp:2,  gems:0, icon:'clock'}
];
const fmtTime=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function finish(){
  stopSpeech(); logTime();
  const before=claimable();
  let xp,title,sub; const perfect=L.errors===0;
  if(L.mode==='jump'){
    UNITS.filter(u=>u.si<L.target).forEach(u=>{S.done[u.key]=LESSONS_PER_UNIT});
    xp=20; title=`Bem-vindo à Etapa ${L.target+1}!`; sub=`Você passou no teste e desbloqueou “${STAGES[L.target].n}”. Os baús das unidades puladas continuam esperando por você.`;
    logEvent('up',`Pulou para a Etapa ${L.target+1}: ${STAGES[L.target].n}.`); S.lessons++; day().lessons++; if(perfect){S.perfect++;day().perfect++;}
  } else if(L.mode==='lesson'){
    if(L.practice){ xp=5+(perfect?2:0); title='Prática concluída!'; sub=L.unit.t; }
    else{
      xp=(L.li===4?15:10)+(perfect?5:0);
      S.done[L.unit.key]=doneOf(L.unit.key)+1;
      const justDone=doneOf(L.unit.key)===LESSONS_PER_UNIT;
      if(justDone){ toast(`${FLAG}Você subiu para o nível ${levelNum()}!`); }
      if(justDone) logEvent(L.unit.ui===L.unit.stage.units.length-1?'trophy':'star', L.unit.ui===L.unit.stage.units.length-1?`Concluiu a etapa “${L.unit.stage.n}”!`:`Concluiu a unidade “${L.unit.t}”.`);
      title=perfect?'Lição perfeita!':'Lição concluída!';
      sub=justDone?`Você completou a unidade “${L.unit.t}”.`:doneOf(L.unit.key)===CHEST_AFTER?`Baú liberado! Abra-o na trilha para ganhar ${CHEST_GEMS} CapiXP.`:`${L.unit.t} · lição ${doneOf(L.unit.key)} de ${LESSONS_PER_UNIT}`;
      if(justDone && L.unit.ui===L.unit.stage.units.length-1){ S.gems+=STAGE_BONUS; sub=`Você concluiu a etapa “${L.unit.stage.n}” e ganhou +${STAGE_BONUS} CapiXP! ${L.unit.stage.goal}`; }
    }
    S.lessons++; day().lessons++; if(perfect){S.perfect++; day().perfect++;}
  } else { if(L.kind==='theory'){ S.theoryQuiz=S.theoryQuiz||{}; const first=THEORY.find(t=>t.id===L.theoryId).quiz.length-(L.fixList||[]).length; S.theoryQuiz[L.theoryId]=Math.max(S.theoryQuiz[L.theoryId]||0,first); }
    xp=(L.xp||10)+(perfect?2:0); S.hearts=MAX_HEARTS; S.heartsAt=0; title=L.kind==='theory'?'Teste concluído!':L.kind==='story'?'História concluída!':L.kind==='sounds'?'Treino de sons concluído!':'Prática concluída!'; sub='Seus corações foram recarregados.'; day().lessons++; if(perfect){day().perfect++;} }
  const acc=Math.round(L.correct/((L.correct+L.errors)||1)*100);
  const secs=Math.max(1,Math.round((Date.now()-(L.startedAt||Date.now()))/1000));
  const speed=(L.mode==='lesson'&&acc>=70)?SPEED_TIERS.find(t=>secs<=t.max):null;
  if(speed){ xp+=speed.xp; S.gems+=speed.gems; }
  if(L.mode==='lesson'&&!L.practice){ S.bestTime=S.bestTime||{}; const k=L.unit.key+':'+L.li; if(!S.bestTime[k]||secs<S.bestTime[k]) S.bestTime[k]=secs; }
  award(xp); save();
  const newly=claimable()>before; const backTab=(L.kind==='drill'||L.kind==='theory')?'exercises':L.kind==='sounds'?'sounds':L.kind==='story'?'stories':L.mode==='review'?'review':'path';
  app.innerHTML=`<div class="lesson"><div class="body"><div class="wrap result">
    <div class="celebrate">${capy('cheer',190)}<span class="spark s1">✦</span><span class="spark s2">✦</span><span class="spark s3">✦</span></div>
    <h1 class="rtitle">${perfect&&L.mode==='lesson'&&!L.practice?'Lição perfeita!':title}</h1><p class="muted" style="margin:0">${perfect?'Você não errou nenhuma vez!':esc(sub)}</p>
    <div class="tiles ${L.mode==='lesson'?'three':'two'}">
      <div class="tile" style="border-color:var(--gold)"><b style="background:var(--gold);color:#3A2600">Total de XP</b><span style="color:var(--gold-deep)">${ic('bolt',22)} ${xp}</span></div>
      <div class="tile" style="border-color:var(--good)"><b style="background:var(--good)">${acc===100?'Incrível':acc>=80?'Muito bom':acc>=60?'Bom':'Continue'}</b><span style="color:var(--good)">${ic('target',22)} ${acc}%</span></div>
      ${L.mode==='lesson'?`<div class="tile" style="border-color:var(--gem)"><b style="background:var(--gem)">${speed?speed.name:'Tempo'}</b><span style="color:var(--gem)">${ic('clock',22)} ${fmtTime(secs)}</span></div>`:''}</div>
    ${L.mode==='lesson'?(speed?`<div class="speedbonus">${ic(speed.icon,24)}<div><b>Bônus de velocidade: ${speed.name}!</b><span>+${speed.xp} XP${speed.gems?` e +${speed.gems} CapiXP`:''} por terminar em ${fmtTime(secs)}</span></div></div>`
      :`<p class="small" style="margin:0">${acc<70?'Acerte pelo menos 70% para ganhar bônus de velocidade.':`Termine em até ${fmtTime(SPEED_TIERS[SPEED_TIERS.length-1].max)} para ganhar bônus de velocidade.`}</p>`):''}
    ${perfect&&sub&&L.mode==='lesson'&&!L.practice&&!/lição \d+ de/.test(sub)?`<p class="small" style="margin:0">${esc(sub)}</p>`:''}
    ${newly?`<div class="panel" style="width:100%;display:flex;align-items:center;gap:12px;text-align:left"><div style="color:var(--gold)">${ic('chest',44)}</div><div style="flex:1"><b>Missão completa!</b><div class="small">Abra o baú em Missões do dia para pegar seus CapiXP.</div></div></div>`:''}
    </div></div>
    <div class="foot"><div class="wrap frow">${(L.log||[]).length?'<button class="btn alt skip" data-revlesson>Revisar lição</button>':''}<button class="btn go" data-done>Continuar</button></div></div></div>`;
  const doneL=L;
  const rv=app.querySelector('[data-revlesson]'); if(rv) rv.onclick=()=>showLessonReview(doneL);
  app.querySelector('[data-done]').onclick=()=>{L=null;openNode=null;tab=newly?'missions':backTab;render.scrolled=false;bannerUnit=null;render();if(newly)window.scrollTo(0,0)};
}
function fixIntro(){
  stopSpeech();
  const n=L.fixList.length;
  app.innerHTML=`<div class="lesson"><div class="wrap head"><button class="close" data-quit aria-label="Sair">${I.x}</button><div class="prog"><i style="width:100%"></i></div></div>
    <div class="body"><div class="wrap result">${capy('book',160)}
    <h1>Hora de corrigir os erros!</h1><p class="muted" style="margin:0">Você errou ${n} ${n===1?'exercício':'exercícios'}. Acerte ${n===1?'ele':'todos'} agora para concluir. Aqui você não perde corações.</p>
    <div class="fixprev">${L.fixList.map(e=>`<div class="revrow no"><span class="rv-ic">${I.x}</span><div class="small" style="min-width:0">${esc(promptOf(e))}</div></div>`).join('')}</div></div></div>
    <div class="foot"><div class="wrap frow"><button class="btn go" data-fixgo>Corrigir</button></div></div></div>`;
  app.querySelector('[data-quit]').onclick=()=>{logTime();L=null;render()};
  app.querySelector('[data-fixgo]').onclick=()=>{ L.inFix=true; L.queue.push(...shuffle(L.fixList)); nextEx(); };
}
function promptOf(e){ if(e.type==='samediff') return `Iguais ou diferentes? ${e.a} / ${e.b}`; if(e.type==='sound') return `Som /${e.ipa}/ (${e.opts.join(' × ')})`; return e.type==='mc'?(e.bubble||e.q):(e.type==='fill'||e.type==='pattern')?e.s:e.type==='build'?e.pt:(e.type==='rev'||e.type==='listen')?e.en:e.type==='pic'?`Imagem: ${e.q}`:e.type==='pairs'?'Combine os pares':''; }
function answerOf(e){ if(e.type==='samediff') return e.answer; return (e.type==='build'||e.type==='listen')?e.en:e.type==='rev'?e.pt:(e.type==='fill'||e.type==='pattern')?e.s.replace('___',e.answer):e.type==='pairs'?e.pairs.map(p=>p[0]+' = '+p[1]).join(' · '):e.answer; }
function showLessonReview(l){
  const seen=new Set(), rows=(l.log||[]).filter(x=>{ if(seen.has(x.e.id+x.ok)) return false; seen.add(x.e.id+x.ok); return true; });
  const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div class="sheet"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2>Revisar lição</h2><button class="close" data-x aria-label="Fechar" style="width:36px;height:36px;color:var(--muted)">${I.x}</button></div>
    <div class="revlist">${rows.map(x=>`<div class="revrow ${x.ok?'ok':'no'}"><span class="rv-ic">${x.ok?I.check:I.x}</span><div style="min-width:0"><div class="small">${esc(promptOf(x.e))}</div><b>${esc(answerOf(x.e))}</b></div>${x.e.en||x.e.type==='pattern'?`<button class="rv-snd" data-s="${esc(x.e.en||x.e.s.replace('___',x.e.answer))}" aria-label="Ouvir">${I.sound}</button>`:''}</div>`).join('')}</div></div>`;
  document.body.appendChild(m);
  m.onclick=ev=>{ if(ev.target===m||ev.target.closest('[data-x]')) m.remove(); const sb=ev.target.closest('[data-s]'); if(sb) speak(sb.dataset.s); };
}
function outOfHearts(){
  L=null;
  const mins=Math.max(1,Math.ceil((REGEN_MS-(Date.now()-S.heartsAt))/60000));
  app.innerHTML=`<div class="lesson"><div class="body"><div class="wrap result">
    ${capy('wave',150)}
    <h1>Seus corações acabaram</h1>
    <p class="muted" style="margin:0">Faça uma prática rápida, use CapiXP, ou espere ${mins} min para ganhar mais um.</p></div></div>
    <div class="foot"><div class="wrap" style="display:flex;flex-direction:column;gap:12px">
      <button class="btn" data-rev>Praticar e recarregar</button>
      <button class="btn gem" data-gems ${S.gems>=HEART_REFILL_GEMS?'':'disabled'}>Recarregar por ${HEART_REFILL_GEMS} CapiXP (você tem ${S.gems})</button>
      <button class="btn alt" data-back>Voltar à trilha</button></div></div></div>`;
  app.querySelector('[data-rev]').onclick=()=>startReview(S.mistakes.length?'mistakes':UNITS.some(u=>doneOf(u.key)>0)?'mix':'first');
  app.querySelector('[data-gems]').onclick=()=>{S.gems-=HEART_REFILL_GEMS;S.hearts=MAX_HEARTS;S.heartsAt=0;save();render();toast(`${I.heart}Corações recarregados`)};
  app.querySelector('[data-back]').onclick=()=>render();
}

if(TTS){ try{speechSynthesis.getVoices(); speechSynthesis.addEventListener('voiceschanged',()=>{ if(tab==='profile'&&!L) render(); });}catch(e){} }
document.addEventListener('keydown',ev=>{
  if(ev.target.closest&&ev.target.closest('input,select,textarea')) return;
  const lesson=document.querySelector('.lesson'); if(!lesson) return;
  if(ev.key==='Enter'){ const b=lesson.querySelector('[data-next],[data-check]:not(:disabled),[data-done]'); if(b){ev.preventDefault();b.click();} return; }
  if(!L||!L.cur||L.cur.checked||!/^[0-9]$/.test(ev.key)) return;
  const k=ev.key==='0'?10:+ev.key, c=L.cur;
  if(c.type==='pairs'){ const n=c.left.length; const tgt=k<=n?c.left[k-1]:c.right[k-n-1]; if(tgt&&!c.matched.has(tgt.i)) pairTap(k<=n?'l':'r',tgt.i); return; }
  const b=lesson.querySelector(`[data-opt="${k-1}"]`); if(b) b.click();
});
render();
checkServer();
setInterval(()=>{ if(!serverCloud||!serverOn) recheckServerVoice(); },20000);
setInterval(()=>{ if(!L&&guideStage===null){ const h=S.hearts,d=S.day&&S.day.date; regen(); if(S.hearts!==h||d!==today()) render(); } },60000);
