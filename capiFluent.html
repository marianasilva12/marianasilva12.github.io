<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="theme-color" content="#2A55E5">
<meta name="description" content="CapiFluent: aprenda inglês do básico ao avançado com a Capi.">
<title>CapiFluent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* CapiFluent — estilos */
/* estilos base */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: phone = sticky stats bar + path + bottom nav; desktop = left menu | path with sticky unit banner | right column (stats, stage, 5 daily missions). */
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --sunk:#E8EDF6; --ink:#16203A; --muted:#5A6684; --line:#D7DEEC;
  --accent:#2A55E5; --accent-deep:#1A3BB0; --on-accent:#FFFFFF;
  --gold:#E9A321; --gold-deep:#B97A07; --heart:#E0475A; --gem:#1E9BD7; --gem-deep:#13729F;
  --good:#16935F; --good-bg:#DDF5E9; --bad:#C93A47; --bad-bg:#FBE3E5;
  --locked:#D3DAE8; --locked-deep:#B3BDD1; --on-stage:#FFFFFF;
  --s1:#2A55E5; --s1d:#1A3BB0; --s2:#0E9488; --s2d:#08665E; --s3:#7A4BE0; --s3d:#5631AE;
  --s4:#E2711D; --s4d:#A84F0D; --s5:#D23D79; --s5d:#9A2353; --s6:#2F3E5C; --s6d:#18233A;
  --f-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px; --topH:58px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111A2B; --surface:#16213A; --sunk:#1F2B47; --ink:#EAF0FF; --muted:#9AA7C7; --line:#2C3A5A;
  --accent:#6E8FFF; --accent-deep:#3F5FD6; --on-accent:#0B1020;
  --gold:#F4BC4A; --gold-deep:#B98612; --heart:#FF6B7C; --gem:#4CC3FF; --gem-deep:#1D86BC;
  --good:#3FD39A; --good-bg:#123A2D; --bad:#FF7A86; --bad-bg:#43202A;
  --locked:#2E3B5C; --locked-deep:#1E2944; --on-stage:#0B1020;
  --s1:#6E8FFF; --s1d:#3F5FD6; --s2:#2CC7B9; --s2d:#138A80; --s3:#A483FF; --s3d:#7451D6;
  --s4:#FF9A4D; --s4d:#C76A1F; --s5:#FF6FA6; --s5d:#C23C72; --s6:#8FA3CC; --s6d:#5A6E98;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111A2B; --surface:#16213A; --sunk:#1F2B47; --ink:#EAF0FF; --muted:#9AA7C7; --line:#2C3A5A;
  --accent:#6E8FFF; --accent-deep:#3F5FD6; --on-accent:#0B1020;
  --gold:#F4BC4A; --gold-deep:#B98612; --heart:#FF6B7C; --gem:#4CC3FF; --gem-deep:#1D86BC;
  --good:#3FD39A; --good-bg:#123A2D; --bad:#FF7A86; --bad-bg:#43202A;
  --locked:#2E3B5C; --locked-deep:#1E2944; --on-stage:#0B1020;
  --s1:#6E8FFF; --s1d:#3F5FD6; --s2:#2CC7B9; --s2d:#138A80; --s3:#A483FF; --s3d:#7451D6;
  --s4:#FF9A4D; --s4d:#C76A1F; --s5:#FF6FA6; --s5d:#C23C72; --s6:#8FA3CC; --s6d:#5A6E98;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:600px;margin:0 auto;padding-inline:16px}
.muted{color:var(--muted)}
.small{font-size:13px;color:var(--muted);font-weight:600}

/* ---------- shell ---------- */
.side,.aside{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);border-bottom:2px solid var(--line);height:var(--topH)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px;height:100%}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;color:var(--accent)}
.brand svg{width:32px;height:32px;flex:none}
.stats{display:flex;gap:4px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;padding:4px 6px;border-radius:10px;font-variant-numeric:tabular-nums;font-size:15px}
.stat svg{width:22px;height:22px;flex:none}
.stat.streak{color:var(--muted)} .stat.streak.on{color:var(--gold)}
.stat.gems{color:var(--gem)} .stat.hearts{color:var(--heart)}
.stat.lvl{color:var(--ink)}
.flag{width:30px;height:20px;flex:none;border-radius:3px}
.chip-c .flag{width:24px;height:16px}
.lvlbadge{display:inline-grid;place-items:center;min-width:30px;height:22px;padding-inline:5px;border-radius:6px;background:var(--accent);color:var(--on-accent);font-size:11px;letter-spacing:.04em}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:flex;justify-content:space-around;padding-block:6px}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;letter-spacing:.03em;color:var(--muted);padding:6px 6px;border-radius:12px;border:2px solid transparent}
.nav button svg{width:26px;height:26px}
.nav button.on{color:var(--accent);background:var(--sunk);border-color:var(--line)}
.dot{position:absolute;top:4px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--heart);border:2px solid var(--surface)}
main{padding-bottom:120px;min-width:0}

@media (min-width:1024px){
  .top,.nav{display:none}
  .shell{display:grid;grid-template-columns:240px minmax(0,1fr) 340px;gap:28px;max-width:1320px;margin:0 auto;padding-inline:16px}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:24px 16px 24px 0;border-right:2px solid var(--line)}
  .side .brand{padding:0 12px 22px}
  .side button{display:flex;align-items:center;gap:16px;padding:10px 14px;border-radius:12px;border:2px solid transparent;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left}
  .side button svg{width:30px;height:30px;flex:none}
  .side button:hover{background:var(--sunk)}
  .side button.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
  .side .dot{position:static;margin-left:auto;border-color:var(--bg)}
  .aside{display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start;padding-block:22px 40px}
  .aside .stats{justify-content:space-between}
  main{padding-bottom:60px}
  main .wrap{padding-inline:0}
  .mobile-only{display:none}
}

/* ---------- unit banner ---------- */
.banner{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--topH) + 10px);z-index:6;margin-top:12px;border-radius:var(--r);padding:14px 16px;background:var(--sc);color:var(--on-stage);box-shadow:0 5px 0 var(--scd);display:flex;align-items:center;justify-content:space-between;gap:12px;transition:background .25s,box-shadow .25s}
@media (min-width:1024px){.banner{top:calc(env(safe-area-inset-top,0px) + 14px);margin-top:14px}}
.banner .eyebrow{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.banner h2{font-size:20px;margin-top:2px;font-family:var(--f-body);font-weight:800}
.banner .guide{flex:none;display:flex;align-items:center;gap:8px;border:2px solid color-mix(in srgb,var(--on-stage) 45%,transparent);border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px;letter-spacing:.05em;text-transform:uppercase;box-shadow:0 3px 0 color-mix(in srgb,#000 22%,transparent)}
.banner .guide svg{width:22px;height:22px}

/* ---------- path ---------- */
.unitsec{padding-top:6px}
.divider{display:flex;align-items:center;gap:14px;margin:34px 0 8px;color:var(--muted);font-weight:700;font-size:15px;text-align:center}
.divider::before,.divider::after{content:"";flex:1;height:2px;background:var(--line)}
.stagehead{margin-top:40px;text-align:center}
.stagehead .k{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sc);border:2px solid var(--sc);padding:3px 10px;border-radius:99px}
.stagehead h2{font-size:26px;margin-top:8px}
.stagehead p{margin:4px auto 0;max-width:46ch;color:var(--muted);font-size:14px}
.path{display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:30px 4px}
.slot{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.node{position:relative;width:72px;height:66px;border-radius:50%;background:var(--sc);box-shadow:0 8px 0 var(--scd);display:grid;place-items:center;color:var(--on-stage);transition:transform .08s,box-shadow .08s}
.node:active{transform:translateY(6px);box-shadow:0 2px 0 var(--scd)}
.node svg{width:32px;height:32px}
.node.locked{background:var(--locked);box-shadow:0 8px 0 var(--locked-deep);color:var(--muted)}
.node.done{background:var(--gold);box-shadow:0 8px 0 var(--gold-deep);color:#3A2600}
.node.chest{border-radius:18px;width:78px;height:62px;background:transparent;box-shadow:none;color:var(--muted)}
.node.chest svg{width:62px;height:62px}
.node.chest.ready{color:var(--gold);animation:wiggle 2.2s ease-in-out infinite}
.node.chest.opened{opacity:.55}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-6deg)}90%{transform:rotate(6deg)}95%{transform:rotate(-3deg)}}
.node .ring{position:absolute;inset:-11px;width:calc(100% + 22px);height:calc(100% + 22px);pointer-events:none}
.node.current::after{content:"COMEÇAR";position:absolute;top:-44px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--sc);border:2px solid var(--line);font-size:14px;font-weight:800;letter-spacing:.06em;padding:5px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
.pop{width:min(320px,100%);background:var(--sc);color:var(--on-stage);border-radius:var(--r);padding:16px;box-shadow:0 5px 0 var(--scd)}
.pop h3{font-size:18px}
.pop p{margin:4px 0 12px;font-size:14px;opacity:.9}
.pop .row{display:flex;gap:8px}
.pop button{flex:1;background:var(--on-stage);color:var(--sc);font-weight:800;border-radius:12px;padding:11px;box-shadow:0 4px 0 color-mix(in srgb,#000 22%,transparent);letter-spacing:.03em}
.pop button.ghost{background:transparent;color:inherit;border:2px solid currentColor;box-shadow:none}
.pop.locked{background:var(--sunk);color:var(--muted);box-shadow:0 5px 0 var(--line)}
.pop .tipbox{margin-top:12px;background:color-mix(in srgb,var(--on-stage) 14%,transparent);border-color:currentColor;color:inherit}

/* ---------- side cards ---------- */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px 18px}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.panel-h h3{font-size:18px;font-family:var(--f-body);font-weight:800}
.link{color:var(--gem);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.stagecard{display:flex;gap:14px;align-items:center}
.hexbadge{width:58px;height:64px;flex:none;display:grid;place-items:center;color:var(--on-stage);font-family:var(--f-display);font-weight:800;font-size:17px;background:var(--sc);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.missions{display:flex;flex-direction:column;gap:18px}
.mission{display:grid;grid-template-columns:40px minmax(0,1fr) 52px;gap:12px;align-items:center}
.mission .mi{width:40px;height:40px;display:grid;place-items:center}
.mission .mi svg{width:34px;height:34px}
.mission .mt{font-weight:800;font-size:15px;margin-bottom:6px}
.mbar{position:relative;height:18px;border-radius:99px;background:var(--sunk);overflow:hidden}
.mbar>i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s;box-shadow:inset 0 -4px 0 color-mix(in srgb,#000 12%,transparent)}
.mbar>span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.mbar.full>span{color:#3A2600}
.chestbtn{width:52px;height:46px;display:grid;place-items:center;color:var(--muted);border-radius:12px}
.chestbtn svg{width:44px;height:44px}
.chestbtn.ready{color:var(--gold);animation:wiggle 2.2s ease-in-out infinite}
.chestbtn.opened{opacity:.5}
.reset-note{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:700;margin-top:14px}
.reset-note svg{width:18px;height:18px}

/* ---------- generic ---------- */
.btn{display:block;width:100%;padding:14px;border-radius:14px;font-weight:800;font-size:16px;letter-spacing:.04em;text-transform:uppercase;background:var(--accent);color:var(--on-accent);box-shadow:0 5px 0 var(--accent-deep)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-deep)}
.btn:disabled{background:var(--sunk);color:var(--muted);box-shadow:0 5px 0 var(--line);cursor:default;transform:none}
.btn.alt{background:var(--surface);color:var(--accent);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.gem{background:var(--gem);color:#fff;box-shadow:0 5px 0 var(--gem-deep)}
.btn.good{background:var(--good);box-shadow:0 5px 0 color-mix(in srgb,var(--good) 60%,#000);color:#fff}
.btn.bad{background:var(--bad);box-shadow:0 5px 0 color-mix(in srgb,var(--bad) 60%,#000);color:#fff}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px}
.section-title{font-size:28px;margin-top:24px}
.big{font-family:var(--f-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:12px;border-bottom:2px solid var(--line)}
.prow:last-child{border-bottom:0}
.switch{width:52px;height:30px;border-radius:99px;background:var(--sunk);border:2px solid var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.2s}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch.on::after{left:24px;background:var(--on-accent)}
.stagebars{display:flex;flex-direction:column;gap:12px}
.bar{height:12px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--sc,var(--gold));border-radius:99px}
.sb-head{display:flex;justify-content:space-between;font-size:14px;font-weight:700;gap:10px}
.sb-head span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.confirm{display:flex;gap:8px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);font-weight:800;padding:10px 16px;border-radius:12px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px color-mix(in srgb,#000 30%,transparent);animation:pop .25s}
.toast svg{width:22px;height:22px;color:var(--gem)}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}}
@media (min-width:1024px){.toast{bottom:32px}}

/* ---------- lesson ---------- */
.lesson{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lesson .head{display:flex;align-items:center;gap:12px;padding-block:16px;width:100%}
.lesson .close{width:36px;height:36px;display:grid;place-items:center;color:var(--muted);border-radius:10px;flex:none}
.lesson .close svg{width:26px;height:26px}
.lesson .prog{flex:1;height:16px;border-radius:99px;background:var(--sunk);overflow:hidden}
.lesson .prog i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .35s;box-shadow:inset 0 -5px 0 color-mix(in srgb,#000 12%,transparent)}
.lesson .body{flex:1;overflow-y:auto}
.lesson .body .wrap{padding-block:8px 24px;display:flex;flex-direction:column;gap:18px}
.kind{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.prompt{font-family:var(--f-display);font-size:24px;font-weight:800}
.sent{font-size:20px;font-weight:600;line-height:1.6}
.blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent);font-weight:800;padding-inline:6px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-weight:600;font-size:17px}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));box-shadow:0 4px 0 var(--accent);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:12px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:600;font-size:17px}
.chip.used{background:var(--sunk);color:transparent;box-shadow:none;border-color:var(--sunk);pointer-events:none}
.answer{min-height:112px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding-block:10px;align-content:flex-start;background:repeating-linear-gradient(to bottom,transparent 0 50px,var(--line) 50px 52px)}
.speak{display:flex;align-items:center;gap:12px}
.spk{width:76px;height:76px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 5px 0 var(--accent-deep);flex:none}
.spk.sm{width:52px;height:52px;border-radius:14px}
.spk svg{width:36px;height:36px}
.spk.sm svg{width:24px;height:24px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .opt{text-align:center;padding:12px 8px;font-size:16px}
.pairs .opt.ok{opacity:.35;pointer-events:none}
.pairs .opt.wrong{border-color:var(--bad);color:var(--bad);box-shadow:0 4px 0 var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.foot{border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
.foot .wrap{padding-block:16px}
.foot.good{background:var(--good-bg);border-color:transparent}
.foot.bad{background:var(--bad-bg);border-color:transparent}
.fb{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.fb h3{font-size:22px}
.foot.good .fb{color:var(--good)} .foot.bad .fb{color:var(--bad)}
.fb .ans{color:var(--ink);font-weight:600}
.tipbox{border-left:4px solid var(--accent);background:var(--sunk);padding:10px 12px;border-radius:0 12px 12px 0;font-size:15px}
.result{text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center;padding-top:6vh}
.result h1{font-size:34px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tile{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.tile b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:4px;color:#fff}
.tile span{display:block;font-size:24px;font-weight:800;padding:8px 4px;font-family:var(--f-display);font-variant-numeric:tabular-nums}

/* ---------- guide ---------- */
.modal{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,#000 50%,transparent);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:20px}}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:86vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:24px}
.sheet .unit{margin-top:16px;padding-top:14px;border-top:2px solid var(--line)}
.sheet .unit h3{font-size:17px}
.sheet .unit p{margin:4px 0 0}
.sheet .topics{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:15px}

/* ---------- coins, decor, jump ---------- */
.path{position:relative}
.node.done{background:radial-gradient(circle at 50% 42%,#FFD45A 0 52%,#F2B22C 53% 100%);box-shadow:0 8px 0 #C68508;color:#B37400}
.node.done svg{filter:drop-shadow(0 1px 0 #FFE9A6)}
.decor{position:absolute;top:38%;width:150px;pointer-events:none;opacity:.95}
.decor.right{right:-6px}.decor.left{left:-6px}
@media (max-width:480px){.decor{width:96px;opacity:.75}.decor.right{right:-14px}.decor.left{left:-14px}}
.jump{position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:7;width:52px;height:52px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);color:var(--gem);display:grid;place-items:center}
.jump svg{width:26px;height:26px;transition:transform .2s}.jump.upw svg{transform:rotate(180deg)}
@media (min-width:1024px){.jump{right:auto;left:calc(50% + 240px);bottom:28px}}

/* ---------- streak panel ---------- */
button.stat{border-radius:10px}
button.stat:hover,button.stat.open{background:var(--sunk)}
.sp-scrim{position:fixed;inset:0;z-index:24}
.streakpop{position:fixed;z-index:25;top:calc(env(safe-area-inset-top,0px) + var(--topH) + 6px);right:12px;width:min(360px,calc(100vw - 24px));border-radius:18px;overflow:hidden;background:var(--s4);color:var(--on-stage);box-shadow:0 18px 40px color-mix(in srgb,#000 35%,transparent);animation:pop .2s}
@media (min-width:1024px){.streakpop{top:calc(env(safe-area-inset-top,0px) + 70px);right:max(16px,calc((100vw - 1320px)/2 + 16px))}}
.sp-top{display:flex;gap:10px;justify-content:space-between;padding:18px 18px 14px}
.sp-top h3{font-size:24px;margin-top:6px}
.sp-top p{margin:6px 0 0;font-weight:600;font-size:15px}
.sp-flame{color:var(--gold);flex:none;filter:drop-shadow(0 0 0 #fff)}
.sp-badge{display:inline-block;background:color-mix(in srgb,#fff 80%,var(--gold));color:#7A4A00;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px}
.sp-week{margin:0 14px 14px;background:var(--surface);color:var(--ink);border-radius:14px;padding:14px}
.sp-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.sp-d span{display:block;font-size:13px;font-weight:800;color:var(--muted)}
.sp-d.today span{color:var(--s4)}
.sp-d i{display:grid;place-items:center;width:30px;height:30px;margin:6px auto 0;border-radius:50%;background:var(--sunk);color:#fff}
.sp-d i.done{background:var(--gold)} .sp-d i.future{background:transparent;border:2px dashed var(--line)}
.sp-d.today i:not(.done){border:2px solid var(--s4);background:transparent}
.sp-d i svg{width:18px;height:18px}
.sp-goal{margin-top:14px}
.sp-foot{background:var(--surface);padding:10px 16px;color:var(--muted)}

/* ---------- leagues ---------- */
.divbadge{width:56px;height:62px;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,var(--dc),var(--dd));clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.badgesrow{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.lb{width:46px;height:52px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,var(--dc),var(--dd));clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.lb.cur{width:74px;height:84px}
.lb.locked{background:var(--locked);color:var(--muted)}
.lb svg{width:20px;height:20px}.lb.cur svg{width:34px;height:34px}
.ltable{margin-top:18px;border-top:2px solid var(--line);padding-top:8px;display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:36px 48px minmax(0,1fr) auto;align-items:center;gap:14px;padding:10px 12px;border-radius:14px}
.lrow.me{background:var(--sunk)}
.lrow.me .ln{color:var(--good)}
.ln{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lx{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.lrow.me .lx{color:var(--ink)}
.rk{text-align:center;font-weight:800;color:var(--muted)} .rk.up{color:var(--good)}
.medal{width:30px;height:30px;margin-inline:auto;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff}
.medal.m1{background:#F0B429;color:#6B4500}.medal.m2{background:#A9B6C8;color:#2E3A4C}.medal.m3{background:#D08A4E;color:#4E2A0B}
.zone{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:8px 0;margin-block:4px;border-top:2px dashed currentColor;border-bottom:2px dashed currentColor}
.zone svg{width:16px;height:16px}
.zone.up{color:var(--good)} .zone.down{color:var(--bad)}
.av{position:relative;display:grid;place-items:center;border-radius:50%;background:var(--avc);color:#fff;font-weight:800;font-family:var(--f-display);flex:none}
.av em{position:absolute;right:-6px;top:-6px;font-style:normal;font-size:.62em;width:1.6em;height:1.6em;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);border-radius:50%}
.statusgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.statusgrid button{aspect-ratio:1;max-width:100%;border-radius:12px;border:2px solid var(--line);background:var(--sunk);font-size:22px;display:grid;place-items:center}
.statusgrid button.on{border-color:var(--gem);background:color-mix(in srgb,var(--gem) 16%,var(--surface))}
.notice{display:flex;align-items:center;gap:12px;margin-top:16px;font-weight:700}
.notice svg{width:24px;height:24px;flex:none}
.notice.up{border-color:var(--good);color:var(--good)} .notice.down{border-color:var(--bad);color:var(--bad)}
.inp{font:inherit;font-weight:700;color:var(--ink);background:var(--sunk);border:2px solid var(--line);border-radius:10px;padding:8px 10px;width:150px;max-width:45%}
.inp:focus{outline:3px solid var(--accent);outline-offset:1px}

/* ---------- banner done, mascot ---------- */
.banner.done{--on-stage:#7A4F00;background:repeating-linear-gradient(115deg,#F7C531 0 70px,#FAD24E 70px 140px);box-shadow:0 5px 0 #C9960C}
.banner.done .guide{border-color:color-mix(in srgb,#7A4F00 35%,transparent)}
.decor{top:30%}
/* ---------- practice ---------- */
.ph{font-family:var(--f-body);font-weight:800;font-size:20px;margin:26px 0 12px}
.hero{position:relative;overflow:hidden;border-radius:18px;min-height:190px;padding:20px;color:#fff;background:linear-gradient(120deg,#1C3F8F 0%,#24306E 45%,#4A2A86 100%);display:flex;align-items:stretch;gap:8px;border:2px solid color-mix(in srgb,#fff 12%,transparent)}
.hero-txt{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start;min-width:0;flex:1}
.hero h3{font-size:22px;font-family:var(--f-body);font-weight:800}
.hero p{margin:4px 0 0;font-weight:600;opacity:.9;max-width:24ch}
.hero-btn{margin-top:auto;background:#fff;color:#2A3AA0;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:10px 16px;border-radius:12px;box-shadow:0 4px 0 #B8C3E8}
.hero-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #B8C3E8}
.hero-art{position:relative;width:170px;flex:none;align-self:flex-end}
.hero-art .target{position:absolute;right:-30px;top:-40px;width:150px;height:150px;opacity:.9}
.hero-art>svg:last-child{position:relative;display:block;margin-left:auto}
@media (max-width:420px){.hero-art{width:120px}.hero-art>svg:last-child{width:120px;height:auto}.hero-art .target{width:110px;height:110px;right:-26px;top:-30px}}
.plist{display:flex;flex-direction:column;gap:12px}
.pcard{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:16px;padding:16px 16px 16px 18px;min-height:96px}
.pcard b{display:block;font-size:17px;font-weight:800}
.pcard span{display:block;color:var(--muted);font-size:14px;font-weight:600;margin-top:2px}
.pcard:not(:disabled):hover{background:var(--sunk)}
.pcard:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pcard:disabled{opacity:.6;cursor:default}
.pc-art{position:relative;width:72px;height:72px;flex:none}
.pc-art svg{width:72px;height:72px}
.pc-art em{position:absolute;top:-10px;right:-8px;font-style:normal;background:var(--heart);color:#fff;font-size:12px;font-weight:800;padding:2px 7px;border-radius:99px;border:2px solid var(--surface);font-variant-numeric:tabular-nums}
.lockart{display:grid;place-items:center;width:72px;height:72px;color:var(--muted)}
.lockart svg{width:34px;height:34px}
.backlink{display:inline-flex;align-items:center;gap:6px;margin-top:22px;color:var(--gem);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.storybox{display:flex;gap:12px;align-items:flex-start}
.storybox>svg{flex:none}
.storylines{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.sline{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-size:17px;font-weight:600}
.sline svg{width:20px;height:20px;flex:none;margin-top:3px;color:var(--accent)}
@media (max-width:480px){.storybox>svg{display:none}}

/* ---------- monthly + friends ---------- */
.monthcard{margin-top:22px;border-radius:18px;padding:18px;background:var(--mc);color:#fff;display:flex;flex-direction:column;align-items:flex-start;gap:6px;box-shadow:0 5px 0 color-mix(in srgb,var(--mc) 70%,#000)}
.monthcard h2{font-family:var(--f-body);font-weight:800;font-size:22px}
.mtag{background:#fff;color:var(--mc);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:6px}
.mdays{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.mdays svg{width:16px;height:16px}
.minner{align-self:stretch;margin-top:24px;background:var(--surface);color:var(--ink);border-radius:14px;padding:14px 16px}
.minner b{display:block;margin-bottom:8px}
.mrow{display:flex;align-items:center;gap:6px}
.mrow .mbar{flex:1;min-width:0}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:28px 0 12px}
.mhead h2{font-family:var(--f-body);font-weight:800;font-size:22px}
.mclock{display:flex;align-items:center;gap:6px;color:var(--gold-deep);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.mclock svg{width:18px;height:18px}
.friendq .fq-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.fq-avs{display:flex;align-items:flex-end;flex:none}
.fq-capi{margin-left:-14px;display:block}
.fbar{position:relative;display:flex;height:22px;border-radius:99px;background:var(--sunk);overflow:hidden}
.fbar i{display:block;height:100%}
.fbar i.me{background:var(--accent)} .fbar i.capi{background:#B87A48}
.fbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.fq-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:13px;font-weight:700;color:var(--muted)}
.fq-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}
.fq-legend i.me{background:var(--accent)} .fq-legend i.capi{background:#B87A48}
.medals{display:flex;flex-direction:column;gap:18px}
.medal-row{display:flex;align-items:center;gap:14px}
.medal-row b{font-weight:800}
.medal-q{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--locked);color:var(--muted);font-weight:800;font-size:22px;flex:none;border:3px solid var(--locked-deep)}

/* ---------- profile ---------- */
.pcover{position:relative;margin-top:20px;height:200px;border-radius:18px;display:grid;place-items:center;padding:0;overflow:visible;background:linear-gradient(160deg,color-mix(in srgb,var(--pc) 35%,var(--sunk)),var(--sunk))}
.pcover .av{border:5px solid var(--surface);margin:0;width:128px!important;height:128px!important;font-size:54px!important}
@media (max-width:420px){.pcover{height:170px}.pcover .av{width:108px!important;height:108px!important;font-size:46px!important}}
.pcover .av em{right:-4px;top:-4px}
.pedit{position:absolute;top:12px;right:12px;width:42px;height:42px;border-radius:12px;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.pedit svg{width:20px;height:20px}
.pinfo{padding-block:18px 18px;border-bottom:2px solid var(--line)}
.pinfo h1{font-family:var(--f-body);font-weight:800;font-size:26px}
.pinfo p{margin:6px 0 10px;font-weight:600}
.pchips{display:flex;gap:8px;flex-wrap:wrap}
.chip-c{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--muted);border:2px solid var(--line);border-radius:10px;padding:4px 10px 4px 4px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.swatches button.on{box-shadow:0 0 0 3px var(--ink)}
.stats4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.st4{position:relative;display:flex;align-items:flex-start;gap:12px;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface)}
.st4 b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.st4 div>span{display:block;color:var(--muted);font-size:14px;font-weight:600}
.st4 .tag{position:absolute;top:-10px;right:10px;font-style:normal;background:var(--good);color:#fff;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px}
.divmini{width:26px;height:29px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,var(--dc),var(--dd));clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);flex:none;margin-top:2px}
.achlist{padding:0}
.ach{display:flex;gap:18px;align-items:center;padding:18px;border-bottom:2px solid var(--line)}
.ach:last-child{border-bottom:0}
.ach-badge{width:76px;height:86px;flex:none;border-radius:12px;background:var(--ac);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 0 color-mix(in srgb,var(--ac) 65%,#000)}
.ach-badge span{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.ach-badge.zero{background:var(--locked);color:var(--muted);box-shadow:0 4px 0 var(--locked-deep)}
.ach-h{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}
.ach-h b{font-weight:800;font-size:17px}
.ach-h span{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.ach-bar{height:16px}
.ach-d{margin-top:8px;font-weight:600;font-size:14px}
.feed{padding:0}
.feed .panel-h{padding:16px 18px 0;margin-bottom:4px}
.fe{padding:14px 18px;border-bottom:2px solid var(--line)}
.fe:last-child{border-bottom:0}
.fe-who{display:flex;align-items:center;gap:12px}
.fe-who b{font-weight:800}
.fe-ic{margin-left:auto;color:var(--gold);flex:none}
.fe p{margin:8px 0 0;font-weight:600}
.fe-empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 18px 18px}
@media (max-width:420px){.ach{gap:12px;padding:14px}.ach-badge{width:62px;height:72px}}
.stagebonus{display:inline-flex!important;align-items:center;gap:6px;margin-top:8px!important;font-weight:800;color:var(--gem)!important;font-size:13px!important}
.stagebonus svg{width:18px;height:18px}

/* ---------- next stage card ---------- */
.nextcard{margin-top:44px;border:2px solid var(--line);border-radius:18px;padding:22px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface)}
.nc-tag{background:var(--sunk);color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.nextcard h3{display:flex;align-items:center;gap:8px;font-family:var(--f-body);font-weight:800;font-size:20px;margin-top:4px}
.nextcard h3 svg{width:20px;height:20px;color:var(--muted)}
.nc-name{color:var(--sc);font-weight:800}
.nextcard p{margin:2px 0 8px;color:var(--muted);max-width:42ch;font-weight:600}
.nextcard .btn{color:var(--gem);max-width:400px}
.later{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.later-row{display:flex;align-items:center;gap:10px;padding:12px 16px;border:2px dashed var(--line);border-radius:14px;color:var(--muted);font-weight:700}
.later-row svg{width:16px;height:16px;flex:none}
.later-row span{flex:1;min-width:0}
.later-row em{font-style:normal;font-size:12px;font-weight:800;color:var(--sc);border:2px solid var(--sc);border-radius:99px;padding:1px 8px}

.vgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 14px;align-items:center;margin-top:12px}
.vgrid label{font-weight:700;font-size:14px}
.inp.sel{width:100%;max-width:100%;font-weight:600}
.vrate{display:flex;align-items:center;gap:10px}
.vrate input{flex:1;min-width:0;accent-color:var(--accent)}
.vrate span{font-weight:800;font-variant-numeric:tabular-nums;min-width:3ch}
.vtest{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:14px}
.vtest svg{width:20px;height:20px}

/* ---------- exercise layout v2 ---------- */
.lesson .body .wrap{gap:22px;padding-top:18px}
.ex-title{font-family:var(--f-body);font-weight:800;font-size:26px;line-height:1.2;text-wrap:balance}
.prompt.sm{font-size:20px}
.speaker{display:flex;align-items:flex-end;gap:6px;border-bottom:2px solid var(--line);padding-bottom:0}
.capy-mini{flex:none;margin-bottom:-6px}
.capy-mini svg ellipse:first-child{display:none}
.bubble{position:relative;align-self:center;margin-bottom:34px;display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:16px;padding:10px 14px;background:var(--surface);font-weight:700;font-size:18px;min-width:0}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;width:16px;height:16px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.bub-snd{flex:none;color:var(--gem);display:grid;place-items:center}
.bub-snd svg{width:26px;height:26px}
.bub-text{min-width:0}
.hw{font-weight:700;border-bottom:2px dashed color-mix(in srgb,var(--muted) 60%,transparent);padding:0 1px;line-height:1.7}
.hw:hover{color:var(--gem);border-color:var(--gem)}
.answer{min-height:150px;border-top:0;background:repeating-linear-gradient(to bottom,transparent 0 48px,var(--line) 48px 50px);padding-top:4px}
.chips.bank{justify-content:center;gap:10px}
.chip{border-radius:14px;padding:10px 15px;box-shadow:0 4px 0 var(--line)}
.chip.used{box-shadow:none}
.frow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.frow .btn{width:auto;min-width:150px;padding-inline:28px}
.frow .btn.skip{color:var(--muted)}
.frow .btn.go{margin-left:auto}
@media (max-width:560px){.frow .btn.go{flex:1}.frow .btn.skip{min-width:0}.foot.good .frow .btn.go,.foot.bad .frow .btn.go{flex:1 1 100%}}
.fb{display:flex;align-items:flex-start;gap:14px;margin:0;flex:1 1 280px;min-width:0}
.fb-ic{flex:none;width:64px;height:64px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.fb-ic svg{width:34px;height:34px}
.foot.good .fb-ic{color:var(--good)} .foot.bad .fb-ic{color:var(--bad)}

.thscore.full{background:var(--good-bg);color:var(--good)}
.thgo{flex:none;color:var(--muted);transform:rotate(180deg)}
.thintro{margin:0;font-size:16px;line-height:1.65}
.thrules{display:flex;flex-direction:column;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.thr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px;padding:12px 14px;align-items:baseline}
.thr+.thr{border-top:2px solid var(--line)}
.thr b{font-weight:800;color:var(--sc)}
.thr span{color:var(--ink);font-weight:500}
@media (max-width:520px){.thr{grid-template-columns:1fr;gap:2px}}
.thtip{display:flex;gap:12px;align-items:flex-start;margin-top:22px;padding:14px 16px;border-radius:16px;background:color-mix(in srgb,var(--gold) 14%,var(--surface));border:2px solid color-mix(in srgb,var(--gold) 45%,var(--line))}
.thtip-ic{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#3A2600;font-weight:800}
.thtip b{font-weight:800}
.thtip p{margin:2px 0 0}
.thcta{flex-direction:column;align-items:center;gap:8px}
.thnav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.thnav .btn{width:auto;display:inline-flex;align-items:center;gap:8px;font-size:13px;padding:10px 14px;text-transform:none;letter-spacing:0;max-width:100%}
.thnav .btn svg{width:16px;height:16px;flex:none}
.thnext{margin-left:auto}
.thnext svg{transform:rotate(180deg)}
.gsec h2>svg{width:22px;height:22px;color:var(--sc)}

/* ---------- prova da unidade ---------- */
.node.exam{border-radius:22px;width:84px;height:74px;background:var(--surface);color:var(--muted);box-shadow:0 8px 0 var(--line);border:3px solid var(--line)}
.node.exam svg{width:36px;height:36px}
.node.exam.ready{background:var(--sc);color:var(--on-stage);border-color:var(--scd);box-shadow:0 8px 0 var(--scd);animation:wiggle 2.6s ease-in-out infinite}
.node.exam.passed{background:var(--gold);color:#3A2600;border-color:var(--gold-deep);box-shadow:0 8px 0 var(--gold-deep)}
.node.exam em{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:800;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:99px;padding:1px 7px;white-space:nowrap}
.examtag{color:var(--sc,var(--accent))}
.examscore{display:flex;align-items:baseline;gap:6px;justify-content:center;padding:10px 22px;border-radius:18px;background:var(--bad-bg);color:var(--bad)}
.examscore.ok{background:var(--good-bg);color:var(--good)}
.examscore b{font-family:var(--f-display);font-size:48px;line-height:1}
.examscore span{font-weight:800}
.svlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:10px}
.svopt{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);font-weight:700}
.svopt span:nth-child(2){flex:1;min-width:0}
.svopt svg{width:18px;height:18px;color:var(--gem);flex:none}
.svopt.on{border-color:var(--gem);background:color-mix(in srgb,var(--gem) 12%,var(--surface))}
.svdot{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);flex:none}
.svopt.on .svdot{border:5px solid var(--gem)}
.tiles.three{grid-template-columns:repeat(3,minmax(0,140px));justify-content:center}
.tiles.three span{display:flex;align-items:center;justify-content:center;gap:6px}
@media (max-width:420px){.tiles.three span{font-size:18px}.tiles.three span svg{width:18px;height:18px}}
.speedbonus{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 16px;border-radius:16px;background:color-mix(in srgb,var(--gem) 14%,var(--surface));border:2px solid color-mix(in srgb,var(--gem) 50%,var(--line));color:var(--gem);max-width:420px;width:100%}
.speedbonus b{display:block;color:var(--ink);font-weight:800}
.speedbonus span{display:block;color:var(--muted);font-weight:600;font-size:14px}
.speedbonus svg{flex:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

<script>
/* CapiFluent — conteúdo do curso (etapas, unidades e exercícios).

/* Formato dos exercícios:
   ['mc',  pergunta, 'certa|errada|errada']
