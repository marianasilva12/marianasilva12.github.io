   A primeira opção é sempre a correta; o app embaralha. */
const STAGES = [
{ n:'Fundamentos do inglês', lvl:'Etapa 1 · A1 Iniciante', weeks:'4 a 6 semanas',
  goal:'Conseguir se apresentar e falar informações básicas sobre você.',
  topics:['Alfabeto e pronúncia','Números, cores, dias, meses e horários','Pronomes pessoais','Verbo to be','Cumprimentos e apresentações','Artigos a, an, the','Plural, substantivos e adjetivos','Frases afirmativas, negativas e interrogativas','Família, casa, trabalho e rotina'],
  units:[
  {t:'Cumprimentos e apresentações', tip:'Hello ou Hi = olá. My name is... = meu nome é... Nice to meet you = prazer em conhecer você. How are you? se responde com I\'m fine, thanks.', ex:[
    ['mc','Como se diz "Prazer em conhecer você"?','Nice to meet you|Nice to see me|Good to know me'],
    ['build','Meu nome é Ana','My name is Ana','are|me'],
    ['pairs','Hello:Olá|Goodbye:Tchau|Thank you:Obrigado|Please:Por favor'],
    ['fill','Good ___! (de manhã)','morning|night|evening'],
    ['listen','Nice to meet you','Prazer em conhecer você'],
    ['mc','Qual é a resposta para "How are you?"',"I'm fine, thanks|I'm Ana|I'm from Brazil"],
    ['build','Eu sou do Brasil','I am from Brazil','is|in']]},
  {t:'Números, cores e dias', tip:'Os dias da semana e os meses sempre começam com letra maiúscula: Monday, January. Para horas exatas use o\'clock: three o\'clock.', ex:[
    ['pairs','one:um|three:três|seven:sete|ten:dez'],
    ['pairs','red:vermelho|blue:azul|green:verde|yellow:amarelo'],
    ['mc','Qual dia vem depois de Monday?','Tuesday|Thursday|Sunday'],
    ['fill','There are seven days in a ___.','week|month|year'],
    ['listen','My favorite color is blue','Minha cor favorita é azul'],
    ['build','Hoje é sexta-feira','Today is Friday','Saturday|are'],
    ['mc','Como se diz "três horas"?',"three o'clock|three hours clock|third o'clock"]]},
  {t:'Pronomes e verbo to be', tip:'I am · you are · he/she/it is · we/they are. Negativa: is not (isn\'t), are not (aren\'t). Pergunta: inverta a ordem, Are you a student?', ex:[
    ['fill','She ___ a teacher.','is|am|are'],
    ['fill','They ___ my friends.','are|is|am'],
    ['fill','I ___ not tired.','am|is|are'],
    ['mc','Como se pergunta "Você é estudante?"','Are you a student?|You are a student?|Is you a student?'],
    ['build','Ele não é médico','He is not a doctor','are|no'],
    ['pairs','I:eu|she:ela|we:nós|they:eles'],
    ['listen','We are happy','Nós estamos felizes']]},
  {t:'Artigos, plural e família', tip:'Use a antes de som de consoante (a car) e an antes de som de vogal (an apple). Em inglês o adjetivo vem antes do substantivo: a big house.', ex:[
    ['fill','I have ___ apple.','an|a|two'],
    ['fill','She is ___ engineer.','an|a|two'],
    ['mc','Qual é o plural de "child"?','children|childs|childes'],
    ['build','Uma casa grande','A big house','an|small'],
    ['mc','Qual frase está correta?','It is a red car|It is a car red|It is red a car'],
    ['listen','The books are on the table','Os livros estão na mesa'],
    ['pairs','mother:mãe|father:pai|brother:irmão|sister:irmã']]}
  ]},
{ n:'Inglês básico', lvl:'Etapa 2 · A1–A2', weeks:'6 a 8 semanas',
  goal:'Falar sobre sua rotina, fazer perguntas e entender conversas curtas.',
  topics:['Simple Present','Verbos go, do, make, have, want, need','What, where, when, why, who, how','Auxiliares do e does','Advérbios de frequência','Preposições de lugar e tempo','There is e there are','Can e can\'t','Alimentos, compras, transporte e lugares','Horas, datas, preços e direções'],
  units:[
  {t:'Simple Present e rotina', tip:'Com he, she e it o verbo ganha -s: She works. Negativa com don\'t/doesn\'t e pergunta com Do/Does. Depois de doesn\'t, o verbo volta ao normal: She doesn\'t have.', ex:[
    ['fill','He ___ in a bank.','works|work|working'],
    ['fill',"I ___ like coffee.","don't|doesn't|not"],
    ['fill','___ she live in São Paulo?','Does|Do|Is'],
    ['build','Eu acordo às sete','I wake up at seven','wakes|in'],
    ['mc','Como se diz "Ela não tem carro"?',"She doesn't have a car|She don't have a car|She doesn't has a car"],
    ['listen','They go to school by bus','Eles vão para a escola de ônibus'],
    ['pairs','go:ir|make:fazer|need:precisar|want:querer']]},
  {t:'Perguntas e frequência', tip:'What (o quê), Where (onde), When (quando), Why (por quê), Who (quem), How (como). O advérbio de frequência vem antes do verbo principal (I always study), mas depois do to be (She is always late).', ex:[
    ['pairs','Where:Onde|When:Quando|Why:Por quê|Who:Quem'],
    ['fill','___ do you live? — In Rio.','Where|When|Who'],
    ['fill','I ___ drink coffee in the morning. (sempre)','always|never|sometimes'],
    ['mc','Qual frase está correta?','She is always late|She always is late|Always she is late'],
    ['build','Com que frequência você estuda?','How often do you study','does|much'],
    ['listen','What time do you start work','Que horas você começa a trabalhar']]},
  {t:'Lugares e direções', tip:'in = meses, anos, dentro de lugares · on = dias, superfícies · at = horas, pontos exatos. There is + singular, there are + plural.', ex:[
    ['fill','The meeting is ___ Monday.','on|in|at'],
    ['fill','I was born ___ 1998.','in|on|at'],
    ['fill','There ___ two banks on this street.','are|is|be'],
    ['mc','Como se diz "Tem uma farmácia perto daqui?"','Is there a pharmacy near here?|Are there a pharmacy near here?|Have a pharmacy near here?'],
    ['build','Vire à esquerda no semáforo','Turn left at the traffic light','right|in'],
    ['listen','The bus stop is next to the bank','O ponto de ônibus fica ao lado do banco']]},
  {t:'Can, compras e comida', tip:'can + verbo sem to: I can swim. Negativa: can\'t. Para preços: How much is it? It\'s ten dollars.', ex:[
    ['fill',"I ___ speak Spanish, but not very well.",'can|can to|cans'],
    ['mc','Como perguntar o preço?','How much is this?|How many is this?|What price is this cost?'],
    ['build','Eu gostaria de um café, por favor','I would like a coffee please','want|an'],
    ['pairs','bread:pão|chicken:frango|rice:arroz|beans:feijão'],
    ['fill','Can you ___ me the menu, please?','bring|bringing|brings'],
    ['listen',"I can't drive",'Eu não sei dirigir']]}
  ]},
{ n:'Pré-intermediário', lvl:'Etapa 3 · A2', weeks:'6 a 8 semanas',
  goal:'Contar o que aconteceu, descrever situações e explicar seus planos.',
  topics:['Simple Past','Verbos regulares e irregulares','Futuro com will e going to','Present Continuous','Comparativos e superlativos','Contáveis e incontáveis','Some, any, much, many, a lot of','Should, must e have to','Conectivos and, but, because, so','Experiências, viagens e planos'],
  units:[
  {t:'Simple Past', tip:'Regulares ganham -ed (worked, played). Irregulares mudam: go → went, have → had, see → saw, buy → bought. Na negativa e na pergunta usa-se did + verbo normal: Did you go? I didn\'t go.', ex:[
    ['fill','Yesterday I ___ to the beach.','went|go|goed'],
    ['fill','She ___ TV last night.','watched|watch|watches'],
    ['fill',"We didn't ___ the movie.",'like|liked|likes'],
    ['pairs','buy:bought|see:saw|eat:ate|write:wrote'],
    ['mc','Como se diz "Você viajou no ano passado?"','Did you travel last year?|Do you traveled last year?|Did you traveled last year?'],
    ['build','Eu comprei um livro novo','I bought a new book','buyed|buy'],
    ['listen','We met at the airport','Nós nos encontramos no aeroporto']]},
  {t:'Futuro e Present Continuous', tip:'will = decisão na hora ou previsão. going to = plano já decidido ou evidência. Present Continuous (am/is/are + -ing) = ação acontecendo agora.', ex:[
    ['fill','Look at the clouds! It ___ rain.','is going to|will be|goes to'],
    ['fill',"I'm hungry. I think I ___ order a pizza.",'will|am going|going to'],
    ['fill','She ___ working right now.','is|are|does'],
    ['mc','O que significa "We are leaving tomorrow"?','Nós vamos partir amanhã|Nós partimos ontem|Nós sempre partimos'],
    ['build','O que você está fazendo?','What are you doing','do|is'],
    ['listen',"I'm going to visit my parents",'Vou visitar meus pais']]},
  {t:'Comparações e quantidades', tip:'Palavras curtas: -er / -est (taller, the tallest). Longas: more / most (more expensive). good → better → best. much para incontáveis (water), many para contáveis (people).', ex:[
    ['fill','My brother is ___ than me.','taller|more tall|tallest'],
    ['fill','This is the ___ restaurant in town.','best|better|goodest'],
    ['fill','How ___ water do you drink?','much|many|lot'],
    ['fill','There are ___ people here.','a lot of|much|a little'],
    ['mc','Qual frase está correta?','Do you have any questions?|Do you have some question?|Do you have much questions?'],
    ['build','O Rio é maior que Niterói','Rio is bigger than Niterói','more|then'],
    ['listen','This phone is more expensive than that one','Este celular é mais caro que aquele']]},
  {t:'Modais, conectivos e viagens', tip:'should = conselho · must = obrigação forte ou regra · have to = obrigação externa. because = porque · so = então · but = mas.', ex:[
    ['fill','You ___ see a doctor. (conselho)','should|must to|have'],
    ['fill','I ___ wear a uniform at work.','have to|has to|must to'],
    ['fill',"It was raining, ___ we stayed home.",'so|because|but'],
    ['mc','Como se diz "Eu fiquei porque estava cansado"?','I stayed because I was tired|I stayed so I was tired|I stayed but I was tired'],
    ['build','Você deveria reservar o hotel cedo','You should book the hotel early','must|books'],
    ['listen','Where is the check-in counter','Onde fica o balcão de check-in'],
    ['pairs','luggage:bagagem|flight:voo|ticket:passagem|passport:passaporte']]}
  ]},
{ n:'Inglês intermediário', lvl:'Etapa 4 · A2–B1', weeks:'8 a 10 semanas',
  goal:'Manter conversas sobre assuntos familiares sem traduzir cada palavra.',
  topics:['Present Perfect','Simple Past × Present Perfect','Past Continuous','Zero e first conditional','Gerúndio e infinitivo','Phrasal verbs frequentes','Expressões idiomáticas','Vídeos e podcasts para estudantes','Mensagens e e-mails','Conversas de 5 a 10 minutos'],
  units:[
  {t:'Present Perfect', tip:'have/has + particípio. Use para experiências e ações sem tempo definido: I have been to Chile. Com tempo definido (yesterday, in 2020) use Simple Past. for = duração, since = ponto de início.', ex:[
    ['fill','Have you ___ been to London?','ever|yet|already'],
    ['fill','I have lived here ___ 2019.','since|for|from'],
    ['fill','She has worked here ___ five years.','for|since|during'],
    ['mc','Qual frase está correta?','I saw that movie last week|I have seen that movie last week|I have saw that movie last week'],
    ['build','Eu ainda não terminei',"I haven't finished yet",'already|finish'],
    ['listen','Have you ever eaten sushi','Você já comeu sushi alguma vez']]},
  {t:'Past Continuous e condicionais', tip:'was/were + -ing: ação em andamento no passado, muitas vezes interrompida. Zero conditional: If + presente, presente (verdades). First: If + presente, will + verbo (possibilidade real).', ex:[
    ['fill','I ___ cooking when you called.','was|were|am'],
    ['fill','If you heat ice, it ___.','melts|will melted|melted'],
    ['fill','If it rains tomorrow, we ___ stay home.','will|would|are'],
    ['mc','O que significa "They were sleeping at midnight"?','Eles estavam dormindo à meia-noite|Eles dormem à meia-noite|Eles vão dormir à meia-noite'],
    ['build','Se você estudar, vai passar','If you study you will pass','would|studied'],
    ['listen','What were you doing at eight','O que você estava fazendo às oito']]},
  {t:'Gerúndio, infinitivo e phrasal verbs', tip:'enjoy, finish, avoid + -ing. want, decide, need + to. Phrasal verbs: give up (desistir), find out (descobrir), look for (procurar), turn off (desligar).', ex:[
    ['fill','I enjoy ___ in the park.','running|to run|run'],
    ['fill','She decided ___ a new job.','to look for|looking for|look'],
    ['pairs','give up:desistir|find out:descobrir|look for:procurar|turn off:desligar'],
    ['mc','Como se diz "Não desista!"?',"Don't give up!|Don't give out!|Don't get up!"],
    ['build','Estou procurando minhas chaves','I am looking for my keys','at|look'],
    ['listen','Can you turn off the lights','Você pode desligar as luzes']]},
  {t:'E-mails e expressões', tip:'Expressões comuns: piece of cake (moleza), break the ice (quebrar o gelo), under the weather (meio doente). Em e-mails: I\'m writing to..., Could you...?, I look forward to hearing from you, Best regards.', ex:[
    ['pairs','piece of cake:muito fácil|break the ice:quebrar o gelo|under the weather:meio doente|hit the books:estudar muito'],
    ['mc','Qual é um bom começo de e-mail formal?',"I'm writing to ask about the position|Hey, what's up with the job|Give me info about the job"],
    ['fill','Could you ___ me the report by Friday?','send|sending|to send'],
    ['fill','I look forward to ___ from you.','hearing|hear|heard'],
    ['build','Por favor, me avise se tiver dúvidas','Please let me know if you have any questions','say|has'],
    ['listen','Best regards','Atenciosamente']]}
  ]},
{ n:'Intermediário avançado', lvl:'Etapa 5 · B1–B2', weeks:'10 a 14 semanas',
  goal:'Conversar sobre temas profissionais, defender opiniões e compreender boa parte do inglês cotidiano.',
  topics:['Present Perfect Continuous','Past Perfect e tempos combinados','Second e third conditional','Voz passiva','Reported Speech','Who, which, that, whose','Collocations e phrasal verbs','Notícias e artigos','Filmes e séries com legenda em inglês','Debates, apresentações e entrevistas'],
  units:[
  {t:'Tempos perfeitos', tip:'Present Perfect Continuous: have been + -ing, para duração até agora. Past Perfect: had + particípio, para o passado do passado (When I arrived, the train had left).', ex:[
    ['fill',"I've ___ waiting for an hour.",'been|being|be'],
    ['fill','When I arrived, the train ___ already left.','had|has|was'],
    ['mc','Qual frase destaca a duração até agora?','She has been studying all day|She studied all day yesterday|She had studied all day'],
    ['build','Eu nunca tinha visto neve antes','I had never seen snow before','have|saw'],
    ['listen','How long have you been working here','Há quanto tempo você trabalha aqui'],
    ['fill','By the time we got there, the movie ___.','had started|has started|starts']]},
  {t:'Second e third conditional', tip:'Second: If + passado, would + verbo (hipótese no presente): If I had money, I would travel. Third: If + had + particípio, would have + particípio (passado que não aconteceu).', ex:[
    ['fill','If I ___ rich, I would buy a house.','were|am|will be'],
    ['fill','If she had studied, she ___ passed.','would have|would|will have'],
    ['mc','O que significa "If I had known, I would have helped"?','Se eu soubesse, teria ajudado|Se eu souber, vou ajudar|Eu sabia e ajudei'],
    ['build','O que você faria se fosse eu?','What would you do if you were me','will|was'],
    ['listen','If I were you I would accept the offer','Se eu fosse você, aceitaria a oferta']]},
  {t:'Voz passiva e Reported Speech', tip:'Passiva: be + particípio (The bridge was built in 1974). No discurso indireto o tempo verbal recua: "I am tired" → She said she was tired. will → would.', ex:[
    ['fill','This house ___ built in 1950.','was|is|were'],
    ['fill','English ___ spoken all over the world.','is|are|has'],
    ['fill','He said he ___ busy.','was|is|will'],
    ['mc','Como relatar "I will call you"?','She said she would call me|She said she will called me|She said I would call you'],
    ['build','O relatório foi enviado ontem','The report was sent yesterday','send|is'],
    ['listen','The meeting has been cancelled','A reunião foi cancelada']]},
  {t:'Relativas e entrevistas', tip:'who = pessoas · which = coisas · that = ambos · whose = posse. Collocations: make a decision, take a break, do research, pay attention.', ex:[
    ['fill','The woman ___ called you is my boss.','who|which|whose'],
    ['fill','This is the laptop ___ I bought.','that|who|whose'],
    ['fill','He is the colleague ___ car was stolen.','whose|who|which'],
    ['pairs','make:a decision|take:a break|do:research|pay:attention'],
    ['mc','Boa resposta para "What are your strengths?"',"I'm organized and I learn fast|I don't have strengths|Yes, I am"],
    ['build','Eu gostaria de explicar meu ponto de vista','I would like to explain my point of view','explaining|on'],
    ['listen','Tell me about yourself','Fale-me sobre você']]}
  ]},
{ n:'Inglês avançado', lvl:'Etapa 6 · B2–C1', weeks:'12 a 20 semanas ou mais',
  goal:'Usar o inglês com autonomia em situações sociais, acadêmicas e profissionais.',
  topics:['Tempos verbais avançados e nuances','Third e mixed conditionals','Inversões e estruturas enfáticas','Idiomas e vocabulário avançado','Sotaques e velocidades de fala','Argumentação, negociação e apresentações','Escrita profissional e acadêmica','Reuniões e entrevistas','Livros, artigos técnicos e documentação','Conversação espontânea com autocorreção'],
  units:[
  {t:'Mixed conditionals e nuances', tip:'Mixed: passado irreal com resultado no presente: If I had taken the job, I would be in London now. used to = hábito no passado; be used to + -ing = estar acostumado.', ex:[
    ['fill','If I had saved more, I ___ be worried now.',"wouldn't|won't|hadn't"],
    ['fill','I ___ to working at night now.','am used|used|use'],
    ['mc','Qual frase significa "Eu costumava jogar futebol"?','I used to play football|I am used to playing football|I use to play football'],
    ['build','Se ela tivesse vindo, estaria aqui agora','If she had come she would be here now','will|was'],
    ['listen','Had I known you were coming I would have cooked','Se eu soubesse que você vinha, teria cozinhado']]},
  {t:'Inversão e ênfase', tip:'Depois de expressões negativas, inverta sujeito e auxiliar: Never have I seen..., Not only did she..., Rarely do we... Ênfase com cleft sentences: What I need is time. It was Ana who called.', ex:[
    ['fill','Never ___ I seen such a beautiful place.','have|I have|did'],
    ['fill','Not only ___ she finish early, but she also helped others.','did|she did|does'],
    ['mc','Qual frase usa ênfase corretamente?','What I need is a break|What I need it is a break|That I need is a break'],
    ['build','Raramente nós temos tempo livre','Rarely do we have free time','are|has'],
    ['listen','It was Maria who solved the problem','Foi a Maria quem resolveu o problema']]},
  {t:'Negociação e reuniões', tip:'Linguagem diplomática: I see your point, but... · Would you be open to...? · Let\'s circle back to... · Could we meet halfway?', ex:[
    ['pairs',"I see your point:Entendo seu ponto|meet halfway:chegar a um meio-termo|follow up:dar seguimento|bottom line:ponto principal"],
    ['mc','Forma mais diplomática de discordar:',"I see your point, but I'd suggest another approach|You're wrong about that|That's a bad idea"],
    ['fill','Would you be open ___ a lower price?','to|for|at'],
    ['fill',"Let's ___ to this topic next week.",'circle back|turn down|give up'],
    ['build','Vamos dar seguimento por e-mail',"Let's follow up by email",'with|following'],
    ['listen','Could we schedule a call for Thursday','Podemos marcar uma ligação para quinta']]},
  {t:'Escrita acadêmica', tip:'Conectores formais: however (no entanto), therefore (portanto), moreover (além disso), whereas (enquanto que). Hedging deixa a afirmação cautelosa: this suggests that..., it appears that...', ex:[
    ['pairs','however:no entanto|therefore:portanto|moreover:além disso|whereas:enquanto que'],
    ['fill','The results were promising; ___, more research is needed.','however|therefore|moreover'],
    ['fill','Sales increased; ___, the company hired more staff.','therefore|however|whereas'],
    ['mc','Qual frase faz uma afirmação cautelosa (hedging)?','The data suggests that prices may rise|Prices will definitely rise|Everybody knows prices rise'],
    ['build','Esses resultados indicam uma tendência clara','These results indicate a clear trend','indicates|trends'],
    ['listen','Nevertheless the project was a success','Mesmo assim, o projeto foi um sucesso']]}
  ]}
];

</script>
<script>
/* CapiFluent — teoria de gramática, do A1 ao C1.
   Cada tópico:
     t      título
     d      resumo curto (aparece no cartão)
     intro  explicação principal
     rules  linhas da tabela: [forma, quando usar]
     ex     exemplos: [inglês, português]
     tip    erro comum de quem fala português
     quiz   teste rápido no formato dos exercícios ('fill' ou 'mc'); a 1ª opção é a correta
   lvl = índice da etapa (0 = A1 … 5 = B2–C1) */
const THEORY = [
/* ===================== ETAPA 1 · A1 ===================== */
{ id:'to-be', lvl:0, t:'Verbo to be (am, is, are)', d:'O verbo “ser” e “estar” ao mesmo tempo.',
  intro:'Em inglês, “ser” e “estar” são o mesmo verbo: to be. Ele muda conforme a pessoa. Na negativa, coloque not depois dele; na pergunta, troque a ordem e ponha o verbo antes da pessoa.',
  rules:[['I am','eu sou / estou'],['you / we / they are','você, nós, eles são / estão'],['he / she / it is','ele, ela, isso é / está'],['Negativa: is not (isn’t), are not (aren’t)','I am not não tem forma curta especial: I’m not'],['Pergunta: Are you…? Is she…?','o verbo vem antes da pessoa']],
  ex:[['I am a student.','Eu sou estudante.'],['She is tired today.','Ela está cansada hoje.'],['They aren’t at home.','Eles não estão em casa.'],['Are you from Brazil?','Você é do Brasil?']],
  tip:'Não esqueça o verbo: “I tired” está errado. O certo é “I am tired” (eu estou cansado).',
  quiz:[['fill','She ___ my sister.','is|are|am'],['fill','We ___ not late.','are|is|am'],['mc','Como perguntar “Ele é médico?”','Is he a doctor?|He is a doctor?|Are he a doctor?']] },

{ id:'this-that', lvl:0, t:'This, that, these, those', d:'Para apontar coisas perto ou longe de você.',
  intro:'Use this e these para o que está perto de você (aqui). Use that e those para o que está longe (ali, lá). This e that são para uma coisa só; these e those são para várias.',
  rules:[['this','isto / este / esta (uma coisa, perto)'],['these','estes / estas (várias, perto)'],['that','aquilo / aquele / aquela (uma coisa, longe)'],['those','aqueles / aquelas (várias, longe)'],['this / that também para o tempo','this week = esta semana; that day = naquele dia']],
  ex:[['This is my phone.','Este é o meu celular.'],['These shoes are new.','Estes sapatos são novos.'],['Look at that house!','Olha aquela casa!'],['Those people are my friends.','Aquelas pessoas são minhas amigas.']],
  tip:'O plural muda a palavra: “this books” está errado. Diga “these books” (estes livros) ou “those books” (aqueles livros).',
  quiz:[['fill','___ apples here are sweet.','These|This|That'],['fill','Who is ___ man over there?','that|this|these'],['fill','___ is my bag, right here.','This|Those|These']] },

{ id:'articles', lvl:0, t:'A, an, the', d:'Os artigos: quando usar cada um.',
  intro:'A e an significam “um / uma” e só vão com coisas no singular que você está citando pela primeira vez. The significa “o, a, os, as” e é usado quando já se sabe de qual coisa você fala.',
  rules:[['a + som de consoante','a car, a house, a university (som de “iu”)'],['an + som de vogal','an apple, an egg, an hour (o h é mudo)'],['the','algo específico ou já mencionado: the car I bought'],['sem artigo','coisas em geral no plural: I like dogs. Cats are cute.'],['profissões levam a / an','She is a teacher. (nunca “She is teacher”)']],
  ex:[['I have a dog. The dog is black.','Eu tenho um cachorro. O cachorro é preto.'],['She is an engineer.','Ela é engenheira.'],['The sun is hot.','O sol está quente.'],['I love music.','Eu amo música.']],
  tip:'Em português dizemos “eu amo a música”, mas em inglês coisas em geral não levam the: “I love music”, não “I love the music”.',
  quiz:[['fill','He is ___ honest man.','an|a|the'],['fill','I need ___ umbrella.','an|a|the'],['fill','Close ___ door, please.','the|a|an']] },

{ id:'pronouns', lvl:0, t:'I, me, my, mine', d:'Pronomes: quem faz, quem recebe e de quem é.',
  intro:'Cada pessoa tem quatro formas. A primeira faz a ação (I), a segunda recebe a ação (me), a terceira vem antes de um substantivo (my book) e a quarta fica sozinha (it’s mine).',
  rules:[['I · me · my · mine','eu · me/mim · meu · o meu'],['you · you · your · yours','você · te/você · seu · o seu'],['he · him · his · his','ele · o/ele · dele · o dele'],['she · her · her · hers','ela · a/ela · dela · o dela'],['we · us · our · ours / they · them · their · theirs','nós… / eles…']],
  ex:[['She loves him.','Ela o ama.'],['This is my car.','Este é o meu carro.'],['The car is mine.','O carro é meu.'],['Call us later.','Ligue para nós mais tarde.']],
  tip:'Em português “dele” vem depois (o carro dele). Em inglês o dono vem antes: “his car”, nunca “the car of him”.',
  quiz:[['fill','Can you help ___? (me)','me|I|my'],['fill','That is ___ bag. (dela)','her|she|hers'],['fill','The red car is ___. (nosso)','ours|our|us']] },

{ id:'plural', lvl:0, t:'Plural dos substantivos', d:'Quando é só -s e quando muda tudo.',
  intro:'A regra geral é colocar -s no fim. Mas palavras que terminam em s, sh, ch, x ganham -es, e algumas palavras muito usadas têm plural irregular, que precisa ser decorado.',
  rules:[['+ s','book → books, car → cars'],['+ es (s, sh, ch, x, o)','bus → buses, watch → watches, box → boxes, potato → potatoes'],['consoante + y → ies','city → cities, baby → babies (mas boy → boys)'],['f / fe → ves','knife → knives, life → lives'],['irregulares','man → men, woman → women, child → children, person → people, foot → feet, tooth → teeth']],
  ex:[['I have two children.','Eu tenho dois filhos.'],['There are many people here.','Tem muitas pessoas aqui.'],['She bought three boxes.','Ela comprou três caixas.']],
  tip:'People já é plural: diga “people are”, nunca “peoples are”. O mesmo vale para children e men.',
  quiz:[['fill','I have two ___. (criança)','children|childs|childrens'],['fill','Brush your ___ every day. (dentes)','teeth|tooths|teeths'],['fill','There are many ___ in Brazil. (cidades)','cities|citys|cityes']] },

{ id:'have', lvl:0, t:'Have e has', d:'Ter: I have, she has.',
  intro:'O verbo have (ter) vira has com he, she e it. Na negativa e na pergunta usamos don’t / doesn’t e do / does, e o verbo volta para have.',
  rules:[['I / you / we / they have','eu tenho, você tem, nós temos, eles têm'],['he / she / it has','ele / ela tem'],['Negativa','I don’t have · She doesn’t have (nunca doesn’t has)'],['Pergunta','Do you have…? Does he have…?'],['have também = comer / tomar','have breakfast, have a coffee, have a shower']],
  ex:[['I have two brothers.','Eu tenho dois irmãos.'],['She has a cat.','Ela tem um gato.'],['Do you have time?','Você tem tempo?'],['We have lunch at noon.','Nós almoçamos ao meio-dia.']],
  tip:'Em português dizemos “tem um parque aqui”, mas em inglês isso é there is: “There is a park here”, não “It has a park here”.',
  quiz:[['fill','He ___ a new job.','has|have|haves'],['fill','Does she ___ a car?','have|has|having'],['fill','I ___ breakfast at 7.','have|has|am']] },

/* ===================== ETAPA 2 · A1–A2 ===================== */
{ id:'simple-present', lvl:1, t:'Simple Present', d:'Rotina, hábitos e verdades.',
  intro:'Use o Simple Present para falar do que você faz sempre ou com frequência, e de fatos que são sempre verdade. Com he, she e it o verbo ganha -s.',
  rules:[['I / you / we / they + verbo','I work, they live'],['he / she / it + verbo + s','she works, he lives'],['-es depois de s, sh, ch, x, o','he watches, she goes, it fixes'],['consoante + y → ies','study → studies, fly → flies'],['palavras que combinam','always, usually, often, sometimes, never, every day']],
  ex:[['I work from home.','Eu trabalho de casa.'],['She studies English every day.','Ela estuda inglês todo dia.'],['Water boils at 100 degrees.','A água ferve a 100 graus.']],
  tip:'Não esqueça o -s da terceira pessoa: “she work” está errado. O certo é “she works”.',
  quiz:[['fill','My father ___ in a bank.','works|work|working'],['fill','She ___ TV every night.','watches|watch|watchs'],['fill','They ___ in Rio.','live|lives|living']] },

{ id:'do-does', lvl:1, t:'Do, does, don’t, doesn’t', d:'Negativas e perguntas no presente.',
  intro:'No Simple Present, a negativa e a pergunta precisam de um ajudante: do ou does. Quando does aparece, o -s sai do verbo principal, porque o does já carrega ele.',
  rules:[['I / you / we / they don’t + verbo','I don’t like coffee.'],['he / she / it doesn’t + verbo','She doesn’t like coffee. (sem -s em like)'],['Do + pessoa + verbo?','Do you speak English?'],['Does + he/she/it + verbo?','Does he work here?'],['Respostas curtas','Yes, I do. / No, she doesn’t.']],
  ex:[['I don’t understand.','Eu não entendo.'],['He doesn’t eat meat.','Ele não come carne.'],['Do you like pizza?','Você gosta de pizza?'],['Where does she live?','Onde ela mora?']],
  tip:'Depois de does o verbo fica sem -s: “Does she likes?” está errado. O certo é “Does she like?”.',
  quiz:[['fill','___ your brother play soccer?','Does|Do|Is'],['fill','We ___ have a car.','don’t|doesn’t|aren’t'],['fill','She doesn’t ___ fish.','eat|eats|eating']] },

{ id:'wh', lvl:1, t:'Perguntas com what, where, when…', d:'As palavras de pergunta e a ordem certa.',
  intro:'A palavra de pergunta vem primeiro, depois o ajudante (do, does, is, are, can…), depois a pessoa e o verbo. É a mesma ordem da pergunta de sim ou não, só que com a palavra na frente.',
  rules:[['What','o quê / qual'],['Where · When · Why','onde · quando · por quê'],['Who · Whose','quem · de quem'],['How · How much · How many','como · quanto (incontável) · quantos (contável)'],['Ordem','Palavra + do/does/is + pessoa + verbo: Where do you work?']],
  ex:[['What is your name?','Qual é o seu nome?'],['Where do you live?','Onde você mora?'],['Why are you sad?','Por que você está triste?'],['How many brothers do you have?','Quantos irmãos você tem?']],
  tip:'“Por quê?” é why, mas “porque” (na resposta) é because: “Why? Because I’m tired.”',
  quiz:[['fill','___ do you live? — In São Paulo.','Where|When|Who'],['fill','___ old are you?','How|What|Which'],['mc','Como se pergunta “Quando ela trabalha?”','When does she work?|When she works?|When do she work?']] },

{ id:'in-on-at', lvl:1, t:'In, on, at', d:'Preposições de tempo e lugar.',
  intro:'Pense numa pirâmide: in é para o maior (meses, anos, cidades, países), on é para o médio (dias, datas, superfícies) e at é para o ponto exato (horas, endereços, lugares específicos).',
  rules:[['in','meses, anos, estações, partes do dia: in May, in 2020, in the morning · dentro / cidades: in the box, in Rio'],['on','dias e datas: on Monday, on May 5th · superfícies: on the table, on the wall'],['at','horas: at 7 o’clock, at noon, at night · pontos: at home, at work, at the bus stop'],['sem preposição','this week, next Monday, last year, every day'],['meios de transporte','by bus, by car (mas on foot = a pé)']],
  ex:[['I was born in 1998.','Eu nasci em 1998.'],['The meeting is on Friday.','A reunião é na sexta.'],['See you at 8.','Te vejo às 8.'],['She is at work.','Ela está no trabalho.']],
  tip:'Em português tudo vira “em”. Pense no tamanho: in 2025 (ano), on Monday (dia), at 3 pm (hora).',
  quiz:[['fill','My birthday is ___ June.','in|on|at'],['fill','The class starts ___ 9 o’clock.','at|in|on'],['fill','The keys are ___ the table.','on|in|at']] },

{ id:'can', lvl:1, t:'Can e can’t', d:'Habilidade, possibilidade e pedidos.',
  intro:'Can significa poder ou saber fazer algo. Ele é igual para todas as pessoas (sem -s) e o verbo depois dele fica na forma básica, sem to.',
  rules:[['Afirmativa','I can swim. She can drive.'],['Negativa','can’t / cannot: He can’t come today.'],['Pergunta','Can you help me?'],['Pedidos educados','Can I…? / Could you…? (could é mais educado)'],['Passado','could: I could run fast when I was young.']],
  ex:[['I can speak English.','Eu sei falar inglês.'],['Can you open the door?','Você pode abrir a porta?'],['She can’t come tonight.','Ela não pode vir hoje à noite.']],
  tip:'Nada de to depois de can: “I can to swim” está errado. Diga “I can swim”.',
  quiz:[['fill','She ___ play the guitar.','can|cans|can to'],['fill','___ you help me, please?','Could|Do|Are'],['fill','I can’t ___ now.','talk|to talk|talking']] },

{ id:'there-is', lvl:1, t:'There is e there are', d:'O nosso “tem” / “há”.',
  intro:'Para dizer que algo existe em algum lugar, use there is (singular) ou there are (plural). É o equivalente ao nosso “tem” ou “há”.',
  rules:[['There is + singular','There is a bank near here.'],['There are + plural','There are two cats in the garden.'],['Negativa','There isn’t / There aren’t any…'],['Pergunta','Is there…? / Are there…?'],['Passado','There was / There were']],
  ex:[['There is a pharmacy on the corner.','Tem uma farmácia na esquina.'],['There are many people here.','Tem muitas pessoas aqui.'],['Is there a bus to the airport?','Tem ônibus para o aeroporto?']],
  tip:'Não use have para isso: “It has a beach here” está errado. Diga “There is a beach here”.',
  quiz:[['fill','There ___ three banks on this street.','are|is|have'],['fill','___ there a hotel near here?','Is|Are|Has'],['fill','There ___ a problem yesterday.','was|were|is']] },

/* ===================== ETAPA 3 · A2 ===================== */
{ id:'simple-past', lvl:2, t:'Simple Past', d:'Ações terminadas no passado.',
  intro:'Use o Simple Past para algo que começou e terminou no passado, muitas vezes com um tempo definido (yesterday, last week, in 2019). Verbos regulares ganham -ed; os irregulares têm forma própria.',
  rules:[['Regulares + ed','work → worked, play → played, study → studied'],['Irregulares (decorar)','go → went, have → had, see → saw, buy → bought, eat → ate'],['Negativa: didn’t + verbo básico','I didn’t go. (nunca didn’t went)'],['Pergunta: Did + pessoa + verbo básico','Did you see the movie?'],['Palavras que combinam','yesterday, last night, ago, in 2010']],
  ex:[['I visited my grandma yesterday.','Eu visitei minha avó ontem.'],['She went to Chile last year.','Ela foi para o Chile ano passado.'],['We didn’t watch the game.','Nós não assistimos ao jogo.'],['Did you call him?','Você ligou para ele?']],
  tip:'Depois de did o verbo volta ao normal: “Did you went?” está errado. Diga “Did you go?”.',
  quiz:[['fill','We ___ a pizza last night.','ate|eat|eated'],['fill','Did she ___ the email?','send|sent|sends'],['fill','I ___ to the party. (não fui)','didn’t go|didn’t went|not went']] },

{ id:'will-going', lvl:2, t:'Will x going to', d:'Duas formas de falar do futuro.',
  intro:'Use going to para planos que você já decidiu ou quando há uma evidência agora. Use will para decisões tomadas na hora, promessas, ofertas e previsões de opinião.',
  rules:[['going to: plano já decidido','I’m going to visit my parents on Sunday.'],['going to: evidência agora','Look at the clouds! It’s going to rain.'],['will: decisão na hora','The phone is ringing. — I’ll get it!'],['will: promessa / oferta','I will help you. I’ll call you later.'],['will: previsão / opinião','I think it will be a great year.']],
  ex:[['We are going to buy a house.','Nós vamos comprar uma casa.'],['I’m hungry. I’ll make a sandwich.','Estou com fome. Vou fazer um sanduíche.'],['Don’t worry, I won’t tell anyone.','Não se preocupe, não vou contar para ninguém.']],
  tip:'Will not vira won’t (não “willn’t”).',
  quiz:[['fill','I’ve decided: I ___ study medicine.','am going to|will be|go'],['fill','It’s cold. I think I ___ close the window.','will|am going|going to'],['mc','Qual frase mostra um plano já decidido?','We’re going to travel in July.|I’ll answer the phone!|Maybe it will rain.']] },

{ id:'present-continuous', lvl:2, t:'Present Continuous', d:'O que está acontecendo agora.',
  intro:'Use am / is / are + verbo com -ing para ações acontecendo neste momento ou num período atual. Também serve para planos marcados no futuro próximo.',
  rules:[['am / is / are + verbo-ing','I am reading. She is working.'],['agora','right now, at the moment, look!, listen!'],['período atual','I’m taking an English course this month.'],['futuro marcado','We’re leaving tomorrow at 8.'],['verbos de estado não usam -ing','know, like, love, want, need, understand: I know (não I’m knowing)']],
  ex:[['What are you doing?','O que você está fazendo?'],['It’s raining.','Está chovendo.'],['I’m meeting Ana tonight.','Vou encontrar a Ana hoje à noite.']],
  tip:'Para gostos e opiniões não use -ing: “I’m liking this” soa errado na maioria dos casos. Diga “I like this”.',
  quiz:[['fill','Be quiet! The baby ___ sleeping.','is|are|am'],['fill','I ___ what you mean.','understand|am understanding|understanding'],['fill','They ___ dinner right now.','are having|have|has']] },

{ id:'comparatives', lvl:2, t:'Comparativos e superlativos', d:'Mais que, o mais, menos que.',
  intro:'Palavras curtas ganham -er (mais) e -est (o mais). Palavras longas usam more e the most. Para comparar, use than (que).',
  rules:[['curtas: + er / the + est','tall → taller → the tallest'],['terminam em -y: ier / iest','happy → happier → the happiest'],['longas: more / the most','expensive → more expensive → the most expensive'],['irregulares','good → better → best · bad → worse → worst · far → farther → farthest'],['igualdade','as … as: She is as tall as me.']],
  ex:[['My brother is taller than me.','Meu irmão é mais alto que eu.'],['This is the best pizza in town.','Esta é a melhor pizza da cidade.'],['Rio is more expensive than Recife.','O Rio é mais caro que Recife.']],
  tip:'Não misture as duas formas: “more taller” está errado. Diga “taller”.',
  quiz:[['fill','Cars are ___ than bikes.','faster|more fast|fastest'],['fill','It was the ___ day of my life.','best|better|goodest'],['fill','This book is ___ interesting than that one.','more|most|much']] },

{ id:'much-many', lvl:2, t:'Much, many, some, any', d:'Quantidades: contáveis e incontáveis.',
  intro:'Coisas contáveis (que dá para contar: apples, people) usam many. Incontáveis (water, money, time) usam much. A lot of serve para os dois. Some vai em frases afirmativas e ofertas; any em negativas e perguntas.',
  rules:[['many + contáveis no plural','many books, many people'],['much + incontáveis','much water, much time (mais em perguntas e negativas)'],['a lot of + os dois','a lot of friends, a lot of money'],['some','afirmativas e ofertas: I have some ideas. Would you like some coffee?'],['any','negativas e perguntas: I don’t have any money. Do you have any questions?']],
  ex:[['How many brothers do you have?','Quantos irmãos você tem?'],['How much is it?','Quanto custa?'],['There isn’t any milk.','Não tem leite.']],
  tip:'Money, information, advice e news são incontáveis em inglês: “much money”, “some advice” (nunca “advices”).',
  quiz:[['fill','How ___ people came?','many|much|any'],['fill','I don’t have ___ time.','much|many|some'],['fill','Would you like ___ tea?','some|any|many']] },

{ id:'modals', lvl:2, t:'Should, must, have to', d:'Conselho e obrigação.',
  intro:'Should dá conselho (deveria). Must mostra obrigação forte ou regra, muitas vezes vinda de quem fala. Have to é obrigação que vem de fora (lei, trabalho, regras).',
  rules:[['should','conselho: You should rest.'],['must','obrigação forte / regra: You must wear a seatbelt.'],['have to / has to','obrigação externa: I have to work on Saturday.'],['mustn’t','proibido: You mustn’t smoke here.'],['don’t have to','não precisa (é opcional): You don’t have to come.']],
  ex:[['You should drink more water.','Você deveria beber mais água.'],['She has to wear a uniform.','Ela tem que usar uniforme.'],['You don’t have to pay. It’s free.','Você não precisa pagar. É grátis.']],
  tip:'Mustn’t e don’t have to são bem diferentes: mustn’t = proibido; don’t have to = não é necessário.',
  quiz:[['fill','You look tired. You ___ go to bed.','should|must to|have'],['fill','It’s free. You ___ pay.','don’t have to|mustn’t|shouldn’t to'],['fill','He ___ work on weekends. (é obrigado)','has to|have to|must to']] },

/* ===================== ETAPA 4 · A2–B1 ===================== */
{ id:'present-perfect', lvl:3, t:'Present Perfect', d:'Experiências e ligação passado → presente.',
  intro:'Use have / has + particípio quando o momento exato não importa: experiências de vida, algo que começou no passado e continua, ou um resultado que importa agora.',
  rules:[['have / has + particípio','I have seen, she has finished'],['experiência','Have you ever been to Chile? I’ve never eaten sushi.'],['continua até agora','I’ve lived here for 5 years / since 2019.'],['for x since','for = duração (for two years) · since = ponto de início (since Monday)'],['already / yet / just','already = já · yet = ainda (negativas/perguntas) · just = acabou de']],
  ex:[['I have been to London twice.','Eu já fui a Londres duas vezes.'],['She has worked here since 2020.','Ela trabalha aqui desde 2020.'],['Have you finished yet?','Você já terminou?'],['I’ve just arrived.','Eu acabei de chegar.']],
  tip:'Em português dizemos “eu moro aqui há 5 anos” no presente, mas em inglês é Present Perfect: “I have lived here for 5 years”, não “I live here for 5 years”.',
  quiz:[['fill','I have lived here ___ 2018.','since|for|from'],['fill','She has ___ to Japan twice.','been|went|go'],['fill','Have you finished ___?','yet|already|since']] },

{ id:'past-vs-perfect', lvl:3, t:'Simple Past x Present Perfect', d:'Com tempo definido ou sem tempo definido?',
  intro:'Se você diz quando aconteceu (yesterday, in 2020, last week), use Simple Past. Se o momento não importa ou o período ainda não acabou (today, this week, ever, never), use Present Perfect.',
  rules:[['tempo terminado e definido','Simple Past: I saw her yesterday.'],['sem tempo definido','Present Perfect: I have seen that movie.'],['período ainda aberto','Present Perfect: I’ve drunk three coffees today.'],['perguntas com When','sempre Simple Past: When did you arrive?'],['ever / never / already / yet','geralmente Present Perfect']],
  ex:[['I lost my keys yesterday.','Perdi minhas chaves ontem.'],['I have lost my keys!','Perdi minhas chaves! (e ainda estão perdidas)'],['Did you go to the party last night?','Você foi à festa ontem à noite?']],
  tip:'Nunca use Present Perfect com tempo passado definido: “I have seen him yesterday” está errado. Diga “I saw him yesterday”.',
  quiz:[['fill','I ___ that movie last week.','saw|have seen|have saw'],['fill','She ___ never been to Europe.','has|did|was'],['mc','Qual frase está correta?','When did you arrive?|When have you arrived?|When you arrived?']] },

{ id:'past-continuous', lvl:3, t:'Past Continuous', d:'O que estava acontecendo no passado.',
  intro:'Use was / were + verbo com -ing para uma ação em andamento num momento do passado. Ele aparece muito junto com o Simple Past, quando uma ação interrompe a outra.',
  rules:[['I / he / she / it was + -ing','I was cooking.'],['you / we / they were + -ing','They were sleeping.'],['ação interrompida','I was cooking when you called.'],['duas ações ao mesmo tempo','While I was reading, she was watching TV.'],['when x while','when + ação curta · while + ação longa']],
  ex:[['What were you doing at 8?','O que você estava fazendo às 8?'],['It was raining when we left.','Estava chovendo quando saímos.'],['I was walking home when I saw him.','Eu estava indo para casa quando o vi.']],
  tip:'A ação longa vai no Past Continuous e a curta (que interrompe) no Simple Past: “When you called, I was cooking”.',
  quiz:[['fill','I ___ sleeping when the phone rang.','was|were|did'],['fill','They ___ playing soccer at 5.','were|was|are'],['fill','While she was cooking, he ___ the table.','was setting|set|sets']] },

{ id:'cond-0-1', lvl:3, t:'Zero e first conditional', d:'Se… então: verdades e possibilidades reais.',
  intro:'O zero conditional fala de verdades gerais (sempre acontece). O first conditional fala de algo possível no futuro. Nos dois, depois de if nunca use will.',
  rules:[['Zero: If + presente, presente','If you heat ice, it melts.'],['First: If + presente, will + verbo','If it rains, I will stay home.'],['a ordem pode inverter','I will stay home if it rains. (sem vírgula)'],['unless = if not','Unless you study, you won’t pass.'],['outros modais','If you’re tired, you can / should rest.']],
  ex:[['If you mix blue and yellow, you get green.','Se você mistura azul e amarelo, dá verde.'],['If I have time, I’ll call you.','Se eu tiver tempo, eu te ligo.'],['We won’t go if it rains.','Não vamos se chover.']],
  tip:'Em português dizemos “se eu tiver tempo” (futuro do subjuntivo), mas em inglês usamos o presente: “If I have time”, nunca “If I will have time”.',
  quiz:[['fill','If it ___ tomorrow, we will stay home.','rains|will rain|rained'],['fill','If you study, you ___ pass.','will|would|are'],['fill','Water boils if you ___ it to 100 °C.','heat|will heat|heated']] },

{ id:'gerund-inf', lvl:3, t:'Gerúndio x infinitivo', d:'Enjoy doing ou want to do?',
  intro:'Alguns verbos pedem o próximo verbo com -ing; outros pedem to + verbo. Não há regra única: é preciso aprender os mais comuns. Depois de preposições, sempre use -ing.',
  rules:[['+ -ing','enjoy, finish, avoid, mind, keep, suggest: I enjoy reading.'],['+ to','want, need, decide, hope, plan, learn, promise: I want to travel.'],['depois de preposição: -ing','I’m good at cooking. Thanks for coming.'],['-ing como sujeito','Swimming is good for you.'],['like / love / hate','aceitam os dois: I like dancing / I like to dance.']],
  ex:[['She finished writing the report.','Ela terminou de escrever o relatório.'],['We decided to stay.','Decidimos ficar.'],['I’m interested in learning Spanish.','Tenho interesse em aprender espanhol.']],
  tip:'Depois de preposição nunca use to + verbo: “I’m good at to cook” está errado. Diga “good at cooking”.',
  quiz:[['fill','I enjoy ___ in the park.','running|to run|run'],['fill','They decided ___ a new car.','to buy|buying|buy'],['fill','Thanks for ___ me.','helping|to help|help']] },

{ id:'phrasal', lvl:3, t:'Phrasal verbs', d:'Verbo + partícula com significado novo.',
  intro:'Phrasal verbs juntam um verbo com uma partícula (up, out, off, on…) e ganham um sentido novo, que muitas vezes não dá para adivinhar. Vale aprender os mais usados em frases.',
  rules:[['give up','desistir: Don’t give up!'],['find out','descobrir: I found out the truth.'],['look for / look after','procurar / cuidar de'],['turn on / turn off','ligar / desligar'],['get up / wake up','levantar-se / acordar'],['separáveis','turn the light off = turn off the light (com pronome: turn it off)']],
  ex:[['I’m looking for my keys.','Estou procurando minhas chaves.'],['Can you turn off the TV?','Você pode desligar a TV?'],['She looks after her grandmother.','Ela cuida da avó.']],
  tip:'Com pronome, a partícula vai depois: “turn it off”, nunca “turn off it”.',
  quiz:[['fill','I always ___ up at 6.','get|give|look'],['fill','Please turn ___ the lights.','off|of|out'],['mc','O que significa “find out”?','descobrir|procurar|desistir']] },

/* ===================== ETAPA 5 · B1–B2 ===================== */
{ id:'ppc', lvl:4, t:'Present Perfect Continuous', d:'Ações que vêm acontecendo até agora.',
  intro:'Use have / has been + verbo-ing para mostrar a duração de algo que começou no passado e continua (ou acabou agora e deixou marcas). O foco está no processo e no tempo, não no resultado.',
  rules:[['have / has been + -ing','I have been studying.'],['duração','How long have you been waiting? For an hour.'],['marca recente','You’re wet! — I’ve been running.'],['x Present Perfect','been reading (processo) x have read 3 books (resultado)'],['verbos de estado','não usam: I have known her for years (não “been knowing”)']],
  ex:[['I’ve been working here for two years.','Trabalho aqui há dois anos.'],['It has been raining all day.','Está chovendo o dia todo.'],['How long have you been learning English?','Há quanto tempo você está aprendendo inglês?']],
  tip:'Para “há quanto tempo você…?” use How long + Present Perfect (Continuous), nunca o presente simples.',
  quiz:[['fill','I’ve ___ waiting for an hour.','been|being|be'],['fill','How long have you been ___ here?','living|live|lived'],['fill','I have ___ her since 2010.','known|been knowing|know']] },

{ id:'past-perfect', lvl:4, t:'Past Perfect', d:'O passado do passado.',
  intro:'Use had + particípio para algo que aconteceu antes de outro momento do passado. Ele deixa claro qual ação veio primeiro.',
  rules:[['had + particípio','I had eaten. She had left.'],['ação anterior','When I arrived, the train had already left.'],['by the time','By the time we got there, the movie had started.'],['reported speech','She said she had seen it.'],['third conditional','If I had known… (veja em condicionais)']],
  ex:[['I had never seen snow before that trip.','Eu nunca tinha visto neve antes daquela viagem.'],['When she called, I had already gone to bed.','Quando ela ligou, eu já tinha ido dormir.']],
  tip:'Se a ordem já está clara (before, after), o Simple Past também serve: “I ate before I left”.',
  quiz:[['fill','When I arrived, the train ___ left.','had|has|was'],['fill','She ___ never flown before.','had|has|did'],['fill','By the time we got there, the party ___.','had ended|has ended|ends']] },

{ id:'cond-2-3', lvl:4, t:'Second e third conditional', d:'Hipóteses no presente e no passado.',
  intro:'O second conditional imagina algo irreal ou pouco provável agora. O third conditional imagina um passado diferente, que não aconteceu.',
  rules:[['Second: If + passado, would + verbo','If I had money, I would travel.'],['were para todos (mais formal)','If I were you, I would accept.'],['Third: If + had + particípio, would have + particípio','If she had studied, she would have passed.'],['could / might no lugar de would','If I had time, I could help you.'],['contrações','I’d = I would / I had (pelo contexto)']],
  ex:[['If I won the lottery, I would buy a house.','Se eu ganhasse na loteria, compraria uma casa.'],['If I were you, I’d call her.','Se eu fosse você, ligaria para ela.'],['If we had left earlier, we wouldn’t have missed the flight.','Se tivéssemos saído antes, não teríamos perdido o voo.']],
  tip:'Nunca coloque would depois de if: “If I would have money” está errado. Diga “If I had money”.',
  quiz:[['fill','If I ___ rich, I would travel the world.','were|am|will be'],['fill','If she had studied, she ___ passed.','would have|would|will have'],['mc','Qual frase fala de um passado que não aconteceu?','If I had known, I would have helped.|If I know, I will help.|If I knew, I would help.']] },

{ id:'passive', lvl:4, t:'Voz passiva', d:'Quando a ação importa mais que quem fez.',
  intro:'Use be + particípio quando quem fez a ação não é importante, é desconhecido ou óbvio. O tempo verbal fica no verbo be. Para dizer quem fez, use by.',
  rules:[['presente: am / is / are + particípio','English is spoken here.'],['passado: was / were + particípio','The house was built in 1950.'],['futuro: will be + particípio','The results will be announced tomorrow.'],['Present Perfect: has / have been + particípio','The meeting has been cancelled.'],['quem fez: by','The book was written by Machado de Assis.']],
  ex:[['My phone was stolen.','Meu celular foi roubado.'],['Breakfast is served at 7.','O café da manhã é servido às 7.'],['The bridge is being repaired.','A ponte está sendo consertada.']],
  tip:'O verbo principal sempre vai no particípio: “The house was build” está errado. Diga “was built”.',
  quiz:[['fill','This house ___ built in 1950.','was|is|were'],['fill','English ___ spoken all over the world.','is|are|has'],['fill','The meeting has been ___.','cancelled|cancel|cancelling']] },

{ id:'reported', lvl:4, t:'Reported speech', d:'Contar o que alguém disse.',
  intro:'Ao contar o que alguém disse, o tempo verbal costuma “voltar um passo” e os pronomes mudam conforme quem fala. Say não pede pessoa depois; tell pede (tell me, tell her).',
  rules:[['presente → passado','“I am tired.” → She said she was tired.'],['will → would','“I will call you.” → He said he would call me.'],['passado → past perfect','“I saw it.” → She said she had seen it.'],['perguntas: sem inversão','“Where do you live?” → He asked where I lived.'],['say x tell','She said (that)… · She told me (that)…']],
  ex:[['He said he was busy.','Ele disse que estava ocupado.'],['She told me she would come.','Ela me disse que viria.'],['They asked if I liked pizza.','Eles perguntaram se eu gostava de pizza.']],
  tip:'Não use “said me”: diga “told me” ou “said to me”.',
  quiz:[['fill','He said he ___ busy.','was|is|will'],['fill','She ___ me she would call.','told|said|say'],['mc','Como relatar “Where do you work?”','He asked where I worked.|He asked where did I work.|He asked where do you work.']] },

{ id:'relative', lvl:4, t:'Who, which, that, whose', d:'Ligar frases falando de pessoas e coisas.',
  intro:'Os pronomes relativos ligam duas ideias numa frase só. Who é para pessoas, which para coisas, that para os dois (em frases essenciais) e whose indica posse.',
  rules:[['who','pessoas: The woman who called you is my boss.'],['which','coisas e animais: The laptop which I bought is fast.'],['that','pessoas ou coisas (informal, frases essenciais): The book that I read…'],['whose','posse (de quem / cujo): The man whose car was stolen…'],['pode sumir','quando não é o sujeito: The movie (that) we saw was great.']],
  ex:[['She is the teacher who helped me.','Ela é a professora que me ajudou.'],['This is the house that Jack built.','Esta é a casa que o Jack construiu.'],['I met a girl whose father is a pilot.','Conheci uma garota cujo pai é piloto.']],
  tip:'Depois de vírgula (informação extra), não use that: “My car, which is red, …” — e não “My car, that is red”.',
  quiz:[['fill','The man ___ lives next door is a doctor.','who|which|whose'],['fill','This is the phone ___ I bought yesterday.','that|who|whose'],['fill','She is the girl ___ brother is famous.','whose|who|which']] },

/* ===================== ETAPA 6 · B2–C1 ===================== */
{ id:'mixed', lvl:5, t:'Mixed conditionals', d:'Passado e presente misturados.',
  intro:'Os mixed conditionals juntam tempos diferentes: uma condição no passado com um resultado no presente, ou uma condição presente com resultado no passado.',
  rules:[['passado → presente','If + had + particípio, would + verbo: If I had taken the job, I would live in London now.'],['presente → passado','If + passado, would have + particípio: If I were braver, I would have said something.'],['indicadores','now, today, still (presente) · yesterday, last year (passado)'],['inversão formal','Had I known, I would be there now.']],
  ex:[['If I had saved money, I wouldn’t be broke now.','Se eu tivesse economizado, não estaria sem dinheiro agora.'],['If she spoke English, she would have got the job.','Se ela falasse inglês, teria conseguido o emprego.']],
  tip:'Olhe para o tempo de cada parte: a parte que fala de “agora” usa would + verbo; a que fala do passado usa would have.',
  quiz:[['fill','If I had slept more, I ___ be tired now.','wouldn’t|won’t|hadn’t'],['fill','If he were smarter, he ___ made that mistake.','wouldn’t have|won’t have|didn’t'],['mc','Qual frase liga o passado ao presente?','If I had studied law, I would be a lawyer now.|If I study law, I will be a lawyer.|If I studied law, I would be a lawyer.']] },

{ id:'used-to', lvl:5, t:'Used to, be used to, get used to', d:'Hábito antigo x estar acostumado.',
  intro:'Used to + verbo fala de um hábito do passado que acabou. Be used to + -ing significa estar acostumado. Get used to + -ing significa ir se acostumando.',
  rules:[['used to + verbo','hábito antigo: I used to play soccer.'],['didn’t use to','negativa: I didn’t use to like coffee.'],['be used to + -ing / substantivo','estar acostumado: I’m used to waking up early.'],['get used to + -ing','acostumar-se: You’ll get used to living here.'],['would + verbo','hábito antigo em histórias: Every summer we would go to the beach.']],
  ex:[['She used to live in Bahia.','Ela morava na Bahia (antes).'],['I’m used to the noise.','Estou acostumado com o barulho.'],['It took me a month to get used to driving on the left.','Levei um mês para me acostumar a dirigir pela esquerda.']],
  tip:'Depois de be used to vem -ing: “I’m used to wake up early” está errado. Diga “used to waking up”.',
  quiz:[['fill','I ___ to play the piano as a child.','used|am used|use'],['fill','She is used to ___ late.','working|work|worked'],['fill','You’ll soon get used to ___ here.','living|live|lived']] },

{ id:'inversion', lvl:5, t:'Inversão', d:'Never have I… para dar ênfase.',
  intro:'Em linguagem formal ou enfática, algumas expressões negativas ou restritivas vão para o começo da frase e o auxiliar vem antes do sujeito, como numa pergunta.',
  rules:[['Never / Rarely / Seldom','Never have I seen such a view.'],['Not only … but also','Not only did she win, but she also broke the record.'],['No sooner … than','No sooner had I arrived than it started to rain.'],['Hardly … when','Hardly had we sat down when the phone rang.'],['Only then / Only when','Only then did I understand.']],
  ex:[['Rarely do we have free time.','Raramente temos tempo livre.'],['Under no circumstances should you open this door.','Em nenhuma circunstância abra esta porta.']],
  tip:'Precisa do auxiliar: “Never I have seen” está errado. Diga “Never have I seen”.',
  quiz:[['fill','Never ___ I seen such a beautiful place.','have|I have|did'],['fill','Not only ___ she finish early, but she also helped.','did|she did|does'],['fill','Rarely ___ we go out on weekdays.','do|we|are']] },

{ id:'cleft', lvl:5, t:'Cleft sentences (ênfase)', d:'What I need is… / It was Ana who…',
  intro:'Cleft sentences dividem a frase em duas partes para destacar uma informação. São muito usadas na fala para dar ênfase ou corrigir alguém.',
  rules:[['What + sujeito + verbo + is/was','What I need is a vacation.'],['It is/was + destaque + who/that','It was Ana who solved the problem.'],['All + sujeito + verbo','All I want is some peace.'],['The thing / reason / place','The reason I came is to help you.']],
  ex:[['What I love about Rio is the beach.','O que eu amo no Rio é a praia.'],['It was in 2015 that we met.','Foi em 2015 que nos conhecemos.'],['All you need is love.','Tudo de que você precisa é amor.']],
  tip:'Não repita o sujeito: “What I need it is…” está errado. Diga “What I need is…”.',
  quiz:[['mc','Qual frase usa ênfase corretamente?','What I need is a break.|What I need it is a break.|That I need is a break.'],['fill','It was Maria ___ called you.','who|which|what'],['fill','___ I want is some sleep.','All|That|Which']] },

{ id:'connectors', lvl:5, t:'Conectores formais', d:'However, therefore, although, whereas…',
  intro:'Conectores organizam ideias em textos e apresentações. Alguns ligam frases separadas (com ponto e vírgula ou ponto); outros ligam partes da mesma frase.',
  rules:[['contraste: however, nevertheless','The plan was good. However, it failed.'],['contraste na frase: although, even though, whereas','Although it rained, we went out.'],['consequência: therefore, as a result','Sales fell; therefore, prices dropped.'],['adição: moreover, furthermore, in addition','Moreover, the cost is lower.'],['despite / in spite of + substantivo ou -ing','Despite the rain, we went out.']],
  ex:[['The results were promising; however, more research is needed.','Os resultados foram promissores; no entanto, é preciso mais pesquisa.'],['Although he was tired, he finished the work.','Embora estivesse cansado, ele terminou o trabalho.']],
  tip:'Despite não leva of nem frase completa: “despite of the rain” e “despite it rained” estão errados. Diga “despite the rain” ou “although it rained”.',
  quiz:[['fill','___ the rain, we went to the beach.','Despite|Although|However'],['fill','Sales increased; ___, we hired more staff.','therefore|however|although'],['fill','___ she was tired, she kept working.','Although|Despite|Moreover']] },

{ id:'wish', lvl:5, t:'Wish e if only', d:'Desejos e arrependimentos.',
  intro:'Wish mostra desejo de que algo fosse diferente. O tempo verbal “volta um passo”: para o presente use o passado; para o passado use o past perfect; para reclamar de algo que alguém faz, use would.',
  rules:[['presente: wish + passado','I wish I had more time. I wish I were taller.'],['passado: wish + past perfect','I wish I had studied more.'],['reclamação: wish + would','I wish you would stop talking.'],['if only = wish mais forte','If only I had known!'],['habilidade: wish + could','I wish I could speak Japanese.']],
  ex:[['I wish I lived near the beach.','Queria morar perto da praia.'],['She wishes she hadn’t said that.','Ela queria não ter dito aquilo.'],['If only it would stop raining!','Se pelo menos parasse de chover!']],
  tip:'Para desejos do presente não use o presente: “I wish I have” está errado. Diga “I wish I had”.',
  quiz:[['fill','I wish I ___ more money.','had|have|will have'],['fill','I wish I ___ studied harder at school.','had|have|would'],['fill','I wish I ___ speak French.','could|can|will']] }
];

<script>
/* CapiFluent — lógica do app */
const LESSONS_PER_UNIT = 5, CHEST_AFTER = 3, EX_PER_LESSON = 10, MAX_HEARTS = 5, REGEN_MS = 30*60*1000, HEART_REFILL_GEMS = 50, CHEST_GEMS = 20, STAGE_BONUS = 100, JUMP_EX = 12, MAX_JUMP_ERR = 3;

   qs:[['mc','Where does Ana live?','São Paulo|Recife|Rio'],['mc',"What is Ana's job?",'She is a nurse|She is a teacher|She is a doctor'],['fill',"Ana's brother is a ___.",'teacher|nurse|student']]},
  {t:'A Busy Monday', lvl:'A2', after:5, text:['Carlos always wakes up at six.','He drinks coffee and takes the bus to work.','He works in a bank downtown.','On Mondays he has a lot of meetings, so he usually eats lunch at his desk.','He gets home at seven and cooks dinner.'],
   qs:[['mc','How does Carlos go to work?','By bus|By car|On foot'],['mc','Why does he eat at his desk on Mondays?',"He has a lot of meetings|He doesn't like restaurants|He wakes up late"],['fill','Carlos gets home at ___.','seven|six|eight']]},
  {t:'The Trip to Chile', lvl:'A2', after:9, text:['Last year Marta went to Chile with her sister.','They stayed in Santiago for five days.','On the third day, they visited the mountains.','It was very cold, but the view was amazing.','Next year, they are going to visit Peru.'],
   qs:[['mc','Who did Marta travel with?','Her sister|Her mother|Her friend'],['mc','How was the weather in the mountains?','Very cold|Very hot|Rainy'],['fill','Next year they are going to visit ___.','Peru|Chile|Argentina']]},
  {t:'A New Job', lvl:'B1', after:13, text:['Paulo has worked as a designer for three years.','Last month, he applied for a job at a bigger company.','During the interview, he was nervous, but he explained his ideas clearly.','If he gets the job, he will move to Curitiba.',"He hasn't received an answer yet."],

];
function storyOpen(st){ return S.free || doneOf(UNITS[st.after].key)>0; }

const BOT_NAMES = ['Lucas M.','Júlia','Rafael Souza','Bianca','Pedro H.','Camila R.','Thiago','Larissa','Mateus','Ana Clara','Diego','Fernanda L.','Gabriel','Isabela','Bruno','Letícia','Vinícius','Carol','Felipe','Marina','Gustavo','Beatriz S.','Leo','Natália','Igor','Priscila','Caio','Sofia','Renan','Yasmin','Hugo','Paula','Daniel K.','Elisa','Otávio','Jéssica'];
const STATUSES = ['😎','🎉','💪','👀','🍿','🇺🇸','💯','🏆','🔥','📚','🎧','🚀'];
const AV_COLORS = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--gem)','var(--heart)'];
function hashStr(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function weekStart(d=new Date()){const m=new Date(d);m.setHours(0,0,0,0);m.setDate(m.getDate()-((m.getDay()+6)%7));return m}
const WEEK_MS=7*864e5;

/* ===================== MISSÕES DO DIA ===================== */
const MISSIONS = [
  {id:'xp',      t:'Ganhe 50 XP',              goal:50, v:d=>d.xp,                        gems:10, icon:'bolt',  color:'var(--gold)'},

const UNITS = []; const EX = {}; const NO_VOCAB=['4-3-3','2-0-3'];
STAGES.forEach((st,si)=>st.units.forEach((u,ui)=>{
  const key = si+'-'+ui; const list=[];
  u.ex.forEach((e,i)=>{
    const id = key+'-'+i; let o={id,unit:key};
    if(e[0]==='mc') o={...o,type:'mc',q:e[1],opts:e[2].split('|')};
    if(e[0]==='fill') o={...o,type:'fill',s:e[1],opts:e[2].split('|')};
    if(e[0]==='build') o={...o,type:'build',pt:e[1],en:e[2],extra:(e[3]||'').split('|').filter(Boolean)};
    if(e[0]==='listen') o={...o,type:'listen',en:e[1],pt:e[2]};
    if(e[0]==='pairs') o={...o,type:'pairs',pairs:e[1].split('|').map(p=>p.split(':'))};
    o.answer = o.opts? o.opts[0] : o.en; EX[id]=o; list.push(o);
  });
  const gen=[];
  list.forEach(o=>{
    if(o.type==='build'||o.type==='listen') gen.push({id:o.id+'r',unit:key,type:'rev',en:o.en,pt:o.pt,answer:o.pt});
    if(o.type==='pairs' && o.pairs.length>=3 && !NO_VOCAB.includes(o.id)){
      o.pairs.slice(0,2).forEach((pp,j)=>{ const others=o.pairs.filter(x=>x!==pp).slice(0,2);
        gen.push({id:o.id+'v'+j,unit:key,type:'mc',q:`Como se diz “${pp[1]}” em inglês?`,bubble:pp[1],blang:'pt',opts:[pp[0],...others.map(x=>x[0])],answer:pp[0]}); });
      const pp=o.pairs[2], others=o.pairs.filter(x=>x!==pp).slice(0,2);
      gen.push({id:o.id+'v2',unit:key,type:'mc',q:`O que significa “${pp[0]}”?`,bubble:pp[0],blang:'en',opts:[pp[1],...others.map(x=>x[1])],answer:pp[1]});
      const withPic=o.pairs.filter(x=>PIC[x[0].toLowerCase()]);
      if(withPic.length>=3){ const t=withPic[0]; gen.push({id:o.id+'p',unit:key,type:'pic',q:t[1],opts:withPic.slice(0,3).map(x=>x[0]),answer:t[0]});
        const t2=withPic[withPic.length-1]; if(t2!==t) gen.push({id:o.id+'p2',unit:key,type:'pic',q:t2[1],opts:withPic.filter(x=>x!==t2).slice(0,2).concat([t2]).map(x=>x[0]),answer:t2[0]}); }
    }
  });
  const fills=list.filter(o=>o.type==='fill'&&!/\(/.test(o.s));
  if(fills.length>=3) fills.slice(0,2).forEach((t,j)=>{ const exs=fills.filter(x=>x!==t).slice(0,2).map(x=>{const [a,b]=x.s.split('___');return [a,x.answer,b||'']});
    gen.push({id:key+'-pat'+j,unit:key,type:'pattern',s:t.s,opts:t.opts,answer:t.answer,examples:exs}); });
  gen.forEach(g=>{if(g.type==='pic'&&g.opts.length<3)return;EX[g.id]=g;list.push(g)});
  UNITS.push({key,si,ui,t:u.t,tip:u.tip,ex:list,stage:st,idx:UNITS.length});
}));

/* "Palavra nova" nas traduções e itens do exercício de fala */
(()=>{
  const STOP=new Set('the a an is are am was were be been to of in on at and or but i you he she it we they my your his her our their this that these those do does did not have has had will would can could should for with from by as so if me him us them yes no very'.split(' '));
  const seen=new Set(); const toks=t=>String(t).toLowerCase().replace(/[^a-z' -]/g,' ').split(/\s+/).filter(Boolean);
  UNITS.forEach(u=>{
    let flagged=0;
    u.ex.filter(e=>e.type==='rev').forEach(e=>{
      if(flagged>=1) return;
      const cand=e.en.split(' ').map(w=>w.replace(/[.,!?;:"“”]/g,'')).filter((w,i)=>w.length>=3&&!STOP.has(w.toLowerCase())&&!seen.has(w.toLowerCase())&&!(i>0&&/^[A-Z]/.test(w)));
      if(cand.length){ e.newWord=cand.sort((a,b)=>b.length-a.length)[0]; seen.add(e.newWord.toLowerCase()); flagged++; }
    });
    u.ex.forEach(e=>[e.en,e.answer,...(e.pairs||[]).map(p=>p[0])].filter(Boolean).forEach(t=>toks(t).forEach(w=>seen.add(w))));
    let items=u.ex.filter(e=>e.type==='pairs'&&!NO_VOCAB.includes(e.id)).flatMap(e=>e.pairs).filter(p=>p[0].split(' ').length<=3);
    if(items.length<3) items=items.concat(u.ex.filter(e=>(e.type==='build'||e.type==='listen')&&e.en.split(' ').length<=5).map(e=>[e.en.replace(/[.,!?]/g,''),e.pt]));
    u.say=items.length>=2?items:null;
  });
})();

async function pullProgress(){

  if(r.data.state) S={...fresh(),...r.data.state};

function pushProgress(now){

  syncTimer=setTimeout(async()=>{
    try{ const r=await api('/me/progress',{method:'PUT',body:JSON.stringify({state:S})});

async function submitAuth(kind,form){
  if(authBusy) return;
  const body={email:form.email.value.trim(),password:form.password.value};
  if(kind==='signup') body.name=form.name.value.trim();
  authKeep={email:body.email,name:body.name||''};
  if(kind==='signup'&&!body.name){ authErr={name:'Digite seu nome.'}; return render(); }
  if(!body.email){ authErr={email:'Digite seu e-mail.'}; return render(); }
  if(kind==='signup'&&body.password.length<6){ authErr={password:'A senha precisa ter pelo menos 6 caracteres.'}; return render(); }
  authErr={}; authBusy=true; render();
  try{
    const r=await api('/auth/'+kind,{method:'POST',body:JSON.stringify(body)});
    authBusy=false;
    if(!r.ok){ authErr=r.data&&r.data.field?{[r.data.field]:r.data.detail}:{form:(r.data&&r.data.detail)||'Algo deu errado. Tente de novo.'}; return render(); }
    setAuth({token:r.data.token,user:r.data.user});
    if(kind==='signup'){ S.name=r.data.user.name; S.guest=false; storeLocal(); pushProgress(true); }   // o progresso de convidado vai para a conta nova
    else await pullProgress();
    authView=null; authKeep={}; render();
    toast(`${I.check}${kind==='signup'?'Conta criada! Seu progresso fica salvo.':'Bem-vindo de volta, '+esc(r.data.user.name)+'!'}`);
  }catch(e){ authBusy=false; authErr={form:'Não foi possível falar com o servidor. Verifique sua conexão.'}; render(); }
}

function makeBots(week,div){
  const r=rng(hashStr(week+':'+div)); const names=BOT_NAMES.slice().sort(()=>r()-.5);
  return names.slice(0,LEAGUE_SIZE-1).map((n,i)=>({n,c:Math.floor(r()*AV_COLORS.length),
    target:Math.round((45+div*35)*(0.15+r()*2.1)), k:0.6+r()*0.9, st:r()<.45?STATUSES[Math.floor(r()*STATUSES.length)]:''}));
}

function botXp(b,p){return Math.round(b.target*Math.pow(p,b.k))}
function ranking(p=weekProgress()){
  const L=S.league;
  const rows=L.bots.map(b=>({name:b.n,xp:botXp(b,p),c:AV_COLORS[b.c],st:b.st,me:false}));
  rows.push({name:S.name||'Você',xp:L.xp,c:AV_COLORS[S.avc||0],st:S.status,me:true});
  return rows.sort((a,b)=>b.xp-a.xp||(a.me?-1:b.me?1:0));
}
function ensureLeague(){
  const wk=ymd(weekStart());
  if(!S.league){ S.league={week:wk,div:0,xp:0,bots:makeBots(wk,0),result:null,divSince:wk}; save(); return S.league; }
  const L=S.league;
  if(L.week!==wk){
    const rows=ranking(1), pos=rows.findIndex(r=>r.me)+1; let res='stay';
    if(L.xp>0 && pos<=PROMOTE && L.div<DIVS.length-1){L.div++;res='up'}
    else if(pos>LEAGUE_SIZE-DEMOTE && L.div>0){L.div--;res='down'}
    if(L.xp>0&&pos<=3){S.podiums++;logEvent('trophy',`Terminou a semana em ${pos}º lugar na liga!`);}
    if(res!=='stay'){L.divSince=wk; if(res==='up') logEvent('up',`Subiu para a Divisão ${DIVS[L.div].n}!`);}
    L.result={res,pos,div:L.div,from:L.week}; L.week=wk; L.xp=0; L.bots=makeBots(wk,L.div); save();
  }
  return L;
}
