<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>M&amp;M</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: placar de estádio — catálogo em grade de "ingressos", barra de abas inferior no celular, navegação superior no desktop */
:root{
  --bg:#EEF0F6; --surface:#FFFFFF; --ink:#151A30; --muted:#5D6482; --line:#D9DCE8;
  --accent:#E4482F; --accent-ink:#FFFFFF; --star:#F2A81D;
  --c-filme:#D2452E; --c-serie:#6D4BD8; --c-academia:#1F9A63; --c-jogo:#2266D6; --c-restaurante:#C2337A;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --shadow:0 1px 2px rgba(21,26,48,.06),0 6px 20px rgba(21,26,48,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1222; --surface:#181C31; --ink:#ECEEF7; --muted:#9AA0BE; --line:#2A2F4A;
  --accent:#FF6A4F; --accent-ink:#1A0C08; --star:#FFC247;
  --c-filme:#FF6A4F; --c-serie:#9D82FF; --c-academia:#3ECB8C; --c-jogo:#5A95FF; --c-restaurante:#F06BAA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1222; --surface:#181C31; --ink:#ECEEF7; --muted:#9AA0BE; --line:#2A2F4A;
  --accent:#FF6A4F; --accent-ink:#1A0C08; --star:#FFC247;
  --c-filme:#FF6A4F; --c-serie:#9D82FF; --c-academia:#3ECB8C; --c-jogo:#5A95FF; --c-restaurante:#F06BAA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
@media (min-width:860px){body{padding-bottom:0}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:12px}
.logo{display:flex;align-items:baseline;gap:8px;font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.logo .dots{display:inline-flex;gap:3px;transform:translateY(-3px)}
.logo .dots i{width:7px;height:7px;border-radius:50%;display:block}
.desk-nav{display:none;gap:4px;margin-left:12px}
@media (min-width:860px){.desk-nav{display:flex}}
.desk-nav button,.tabbar button{background:none;border:0;color:var(--muted);font-weight:600}
.desk-nav button{padding:8px 14px;border-radius:999px}
.desk-nav button[aria-current="page"]{background:var(--ink);color:var(--surface)}
.top .spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:9px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn svg{width:16px;height:16px}

/* Tab bar mobile */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
@media (min-width:860px){.tabbar{display:none}}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;padding:6px 0;border-radius:12px}
.tabbar svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--accent)}

main{padding-block:24px 48px}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.section{display:flex;flex-direction:column;gap:14px;margin-bottom:36px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px}
.section-head h2{font-family:var(--display);font-weight:800;font-size:28px;text-transform:uppercase;letter-spacing:.01em;line-height:1}

/* Hero scoreboard */
.board{background:var(--ink);color:var(--surface);border-radius:20px;padding:22px;display:grid;gap:18px;grid-template-columns:1fr;margin-bottom:36px;overflow:hidden;position:relative}
@media (min-width:760px){.board{grid-template-columns:1.2fr 1fr;padding:30px}}
.board h1{font-family:var(--display);font-weight:900;font-size:clamp(40px,7vw,72px);line-height:.92;text-transform:uppercase}
.board h1 em{font-style:normal;color:var(--accent)}
.board p{color:color-mix(in srgb,var(--surface) 72%,transparent);max-width:44ch;margin:10px 0 0}
.tally{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:center}
.tally button{background:color-mix(in srgb,var(--surface) 7%,transparent);border:1px solid color-mix(in srgb,var(--surface) 14%,transparent);border-radius:14px;padding:14px;color:var(--surface);text-align:left;display:flex;flex-direction:column;gap:4px}
.tally button:last-child:nth-child(odd){grid-column:1/-1}
.tally button:hover{background:color-mix(in srgb,var(--surface) 12%,transparent)}
.tally .num{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tally .lbl{font-size:13px;display:flex;align-items:center;gap:6px}
.tally .lbl i{width:8px;height:8px;border-radius:50%}

/* Chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.chip i{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0}
.search svg{width:18px;height:18px;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select.sort{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px}

/* Grid of tickets */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
@media (min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}
.card{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.poster{position:relative;aspect-ratio:2/3;max-width:100%;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:12px;color:#fff;box-shadow:var(--shadow);transition:transform .2s ease}
.card:hover .poster{transform:translateY(-3px)}
.poster.wide{aspect-ratio:4/3}
.poster .ptitle{font-family:var(--display);font-weight:800;font-size:22px;line-height:.98;text-transform:uppercase;text-shadow:0 1px 10px rgba(0,0,0,.25);overflow-wrap:anywhere}
.poster .pmeta{font-family:var(--mono);font-size:11px;opacity:.85}
.poster .tag{align-self:flex-start;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:rgba(0,0,0,.28);padding:3px 8px;border-radius:999px;display:inline-flex;gap:5px;align-items:center}
.poster .tag svg{width:12px;height:12px}
.poster::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 10%,rgba(255,255,255,.25),transparent 45%);pointer-events:none}
.poster .notch{position:absolute;left:-7px;right:-7px;top:66%;display:flex;justify-content:space-between;pointer-events:none}
.poster .notch i{width:14px;height:14px;border-radius:50%;background:var(--bg)}
.cmeta{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.cname{font-weight:700;font-size:14.5px;line-height:1.25;color:var(--ink);overflow-wrap:anywhere}
.score{font-family:var(--mono);font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.score svg{width:14px;height:14px;color:var(--star)}

/* Feed */
.feed{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:860px){.feed{grid-template-columns:1fr 1fr}}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:56px 1fr;gap:14px;text-align:left;min-width:0}
.rev .mini{width:56px;aspect-ratio:2/3;border-radius:8px;display:flex;align-items:flex-end;padding:5px;color:#fff;font-family:var(--display);font-weight:800;font-size:11px;line-height:1;text-transform:uppercase;overflow:hidden}
.rev .body{min-width:0;display:flex;flex-direction:column;gap:4px}
.rev .who{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.avatar{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.rev .t{font-weight:700}
.rev p{margin:0;overflow-wrap:anywhere}
.ex{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--muted)}
.stars{display:inline-flex;gap:1px;color:var(--star)}
.stars svg{width:15px;height:15px}

/* Empty */
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* Diary list */
.diary{display:flex;flex-direction:column;gap:10px}
.drow{display:grid;grid-template-columns:64px 44px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-align:left;min-width:0}
.drow .date{font-family:var(--mono);text-align:center;line-height:1.1}
.drow .date b{display:block;font-size:22px}
.drow .date span{font-size:11px;color:var(--muted);text-transform:uppercase}
.drow .mini{width:44px;aspect-ratio:2/3;border-radius:6px}
.drow .name{min-width:0;overflow-wrap:anywhere;font-weight:700}
.drow .sub{font-size:13px;color:var(--muted);font-weight:400}
@media (max-width:480px){.drow{grid-template-columns:44px 1fr auto}.drow .date{display:none}}

/* Stats */
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{font-family:var(--mono);font-size:26px;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,24,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:760px){.scrim{align-items:center;padding:24px}}
.sheet{background:var(--bg);width:100%;max-width:820px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .25s ease}
@media (min-width:760px){.sheet{border-radius:22px;padding:28px}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.card:hover .poster{transform:none}}
.sheet-top{display:grid;grid-template-columns:120px 1fr;gap:18px}
@media (min-width:600px){.sheet-top{grid-template-columns:170px 1fr}}
.sheet-top .poster{padding:10px}
.sheet h2{font-family:var(--display);font-weight:900;font-size:clamp(28px,5vw,44px);line-height:.95;text-transform:uppercase}
.info{display:flex;flex-direction:column;gap:8px;min-width:0}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.big-score{display:flex;align-items:center;gap:14px;margin-top:4px}
.big-score .n{font-family:var(--mono);font-size:40px;font-weight:700;line-height:1}
.big-score .of{font-size:13px;color:var(--muted)}
.dist{display:flex;align-items:flex-end;gap:3px;height:44px}
.dist div{width:10px;background:var(--line);border-radius:2px 2px 0 0;min-height:2px}
.dist div.hot{background:var(--accent)}
.close{position:sticky;top:0;float:right;background:var(--surface);border:1px solid var(--line);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;z-index:2}
.close svg{width:18px;height:18px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;margin-top:20px}
.panel h3{font-size:16px}
.rate{display:flex;gap:2px;align-items:center}
.rate .slot{position:relative;width:34px;height:34px}
.rate .slot svg{width:34px;height:34px;color:var(--line)}
.rate .slot .fill{position:absolute;inset:0;overflow:hidden;color:var(--star)}
.rate .slot .fill svg{color:var(--star)}
.rate .slot button{position:absolute;top:0;bottom:0;width:50%;background:none;border:0;padding:0}
.rate .slot button.l{left:0}.rate .slot button.r{right:0}
.rate-val{font-family:var(--mono);font-weight:700;margin-left:10px;min-width:3ch}
.crit{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:560px){.crit{grid-template-columns:1fr 1fr}}
.crit label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:600}
.crit .row{display:flex;justify-content:space-between}
.crit .row span{font-family:var(--mono)}
input[type=range]{accent-color:var(--accent);width:100%}
.field{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-weight:400}
.field textarea{min-height:90px;resize:vertical}
.form-row{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:560px){.form-row{grid-template-columns:1fr 1fr}}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.toggle svg{width:16px;height:16px}
.toggle[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.reviews{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.reviews .rv{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.reviews .rv p{margin:0;overflow-wrap:anywhere}
.critbars{display:grid;gap:6px;grid-template-columns:1fr}
@media (min-width:560px){.critbars{grid-template-columns:1fr 1fr}}
.cb{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.cb .bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.cb .bar i{display:block;height:100%;background:var(--cbar,var(--c-academia));border-radius:999px}
.cb span:last-child{font-family:var(--mono);text-align:right}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-weight:600;z-index:60;box-shadow:var(--shadow)}
@media (min-width:860px){.toast{bottom:28px}}
.err{color:var(--accent);font-size:13px;font-weight:600}
/* Conta */
#acct{display:flex;align-items:center}
.me-chip{display:inline-flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-weight:700;font-size:14px;max-width:180px}
.me-chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-chip .avatar{width:28px;height:28px;font-size:13px}
@media (max-width:520px){.me-chip span:last-child{display:none}.me-chip{padding:4px}#addBtn span{display:none}#addBtn{padding:9px}}
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:14px 16px;margin-bottom:24px}
.banner p{margin:0;max-width:62ch;min-width:0}
.banner b{display:block}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.swatches button[aria-pressed="true"]{border-color:var(--surface);box-shadow:0 0 0 2px var(--ink)}
.handle{display:flex;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding-left:12px}
.handle span{color:var(--muted);font-weight:700}
.handle input{border:0!important;background:none!important;flex:1;min-width:0;outline:none}
.prof{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:20px}
.prof .avatar{width:72px;height:72px;font-size:32px;font-family:var(--display);font-weight:900}
.prof h2{font-family:var(--display);font-weight:900;font-size:clamp(28px,5vw,40px);line-height:1;overflow-wrap:anywhere}
.prof .pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.prof p{margin:0;color:var(--muted);overflow-wrap:anywhere}
.members{display:flex;gap:10px;flex-wrap:wrap}
.member{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px;font-weight:600}
.member .avatar{width:28px;height:28px;font-size:13px}
.member small{color:var(--muted);font-family:var(--mono)}
.busca{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.busca-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.busca-head p{margin:0;min-width:0;max-width:60ch}
.busca-head p b{display:block}
.btn:disabled{opacity:.5;cursor:default}
.bres{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.bres .mini{width:44px;aspect-ratio:2/3;border-radius:6px}
.bres .name{min-width:0;font-weight:700;overflow-wrap:anywhere}
.bres .sub{font-size:13px;color:var(--muted);font-weight:400}
.bres .btn{padding:7px 14px;font-size:14px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.tabbar button{position:relative}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;display:grid;place-items:center;font-family:var(--mono)}
.codebox{background:var(--ink);color:var(--surface);border-radius:18px;padding:20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.codebox .lbl{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.codebox .code{font-family:var(--mono);font-weight:700;font-size:clamp(30px,7vw,44px);letter-spacing:.08em;line-height:1.1;user-select:all}

.frow small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.frow .btn{padding:7px 14px;font-size:14px}
.compat{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:20px}
.compat .pct{font-family:var(--mono);font-size:36px;font-weight:700;line-height:1;color:var(--accent)}
.compat .meter{flex:1;min-width:140px;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.compat .meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
.fr-panel .frv{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.fr-panel .frv:first-of-type{border-top:0}
.fr-panel .frv p{margin:2px 0 0;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.acts .toggle{padding:6px 12px;font-size:13px}
.acts .toggle svg{width:15px;height:15px}
.rsoc{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.mini-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--muted);font-weight:600}
.mini-btn svg{width:14px;height:14px}
.mini-btn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.coms{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.com{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:14px}
.com p{margin:2px 0 0;overflow-wrap:anywhere}
.comform{display:flex;gap:8px}
.comform input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px}
.comform .btn{padding:8px 14px}
.spoiler-msg{margin:0;color:var(--muted);font-style:italic}

.tabs{margin-top:4px}
.tabs .chip small{font-family:var(--mono);opacity:.7}
.lists{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}

.stack{display:flex;height:96px;padding-right:18px}

.lcard b{overflow-wrap:anywhere;font-size:16px}
.lcard span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}

.linkish{background:none;border:0;padding:0;font-weight:700;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}

function errMsg(e){
  if(e&&e.code==='quota_exceeded')return 'O espaço de dados do M&M está cheio. Exclua avaliações antigas.';
  if(e&&e.code==='invalid_argument')return 'Sua conta não tem permissão para salvar aqui. Peça acesso de Colaborador a quem compartilhou o M&M.';
  return 'Não foi possível salvar agora. Tente de novo em instantes.';

function enqueue(fn){const p=wq.then(fn);wq=p.catch(()=>{});return p}
async function writeDoc(path,body){
  try{await enqueue(()=>S.db.doc(path).set(body));return true}
  catch(e){
    if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*800));try{await enqueue(()=>S.db.doc(path).set(body));return true}catch(e2){toast(errMsg(e2));return false}}

}

  const ok=await writeDoc('perfis/'+S.uid,body);if(!ok)return false;

    const it={...(S.itens[S.uid]||{})};S.local.items.forEach(i=>it[i.id]={...i,por:S.uid});
    const av={...(S.avals[S.uid]||{})};S.local.reviews.forEach(r=>av[r.item]=limpa(r));

  return true;
}
/* Amizades: cada conta tem um código; amigos = os dois se adicionaram */
const COD_CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function novoCodigo(){
  const usados=new Set(Object.values(S.perfis).map(p=>p.codigo));
  for(let t=0;t<50;t++){const a=new Uint32Array(6);crypto.getRandomValues(a);const c=[...a].map(n=>COD_CH[n%COD_CH.length]).join('');if(!usados.has(c))return c}
  return Date.now().toString(36).toUpperCase().slice(-6);
}
const fmtCod=c=>c?c.slice(0,3)+'-'+c.slice(3):'';
const limpaCod=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/^MM(?=.{6}$)/,'');
async function garantirCodigo(){
  const p=S.perfis[S.uid];if(!p||p.codigo||S.gerandoCodigo)return;
  S.gerandoCodigo=true;const body={...p,codigo:novoCodigo()};
  if(await writeDoc('perfis/'+S.uid,body))S.perfis[S.uid]=body;
  S.gerandoCodigo=false;
}
const meusAm=()=>S.amigos[S.uid]||{lista:[],ignorados:[]};
const listaDe=u=>(S.amigos[u]?.lista)||[];
function amigos(){return temConta()?meusAm().lista.filter(u=>u!==S.uid&&S.perfis[u]&&listaDe(u).includes(S.uid)):[]}
function pedidosRecebidos(){if(!temConta())return[];const m=meusAm();return Object.keys(S.amigos).filter(u=>u!==S.uid&&S.perfis[u]&&listaDe(u).includes(S.uid)&&!m.lista.includes(u)&&!m.ignorados.includes(u))}
function pedidosEnviados(){return temConta()?meusAm().lista.filter(u=>S.perfis[u]&&!listaDe(u).includes(S.uid)):[]}
function statusAmizade(u){if(amigos().includes(u))return 'amigo';if(meusAm().lista.includes(u))return 'enviado';if(pedidosRecebidos().includes(u))return 'recebido';return 'nada'}
async function salvarAmigos(lista,ignorados){

  S.amigos[S.uid]=body;refresh();return writeDoc('amigos/'+S.uid,body);
}
async function adicionarAmigo(u){
  const m=meusAm();if(m.lista.includes(u))return true;
  const ok=await salvarAmigos([...m.lista,u],m.ignorados.filter(x=>x!==u));
  if(ok){const p=S.perfis[u];toast(listaDe(u).includes(S.uid)?`Agora você e @${p.usuario} são amigos`:`Pedido enviado para @${p.usuario}`)}

}
async function removerAmigo(u){const m=meusAm();return salvarAmigos(m.lista.filter(x=>x!==u),m.ignorados)}
async function ignorarPedido(u){const m=meusAm();return salvarAmigos(m.lista,[...m.ignorados,u])}
function compat(u){
  const a=S.avals[S.uid]||{},b=S.avals[u]||{};
  const comum=Object.keys(a).filter(k=>b[k]&&itemById(k));
  if(!comum.length)return {n:0,pct:null,comum};
  const dif=comum.reduce((s,k)=>s+Math.abs(a[k].nota-b[k].nota),0)/comum.length;
  return {n:comum.length,pct:Math.round(100-dif/4.5*100),comum};
}

/* Busca completa: Claude encontra qualquer filme, série ou jogo lançado */
const B={ok:false,fn:null,status:'idle',res:[],msg:'',q:'',ctl:null};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function acharExistente(r){
  const t=norm(r.titulo),o=norm(r.original);
  return allItems().find(i=>i.cat===r.cat&&(norm(i.titulo)===t||(o&&(norm(i.titulo)===o||norm(i.original)===o)))&&(!r.ano||!i.ano||Math.abs(i.ano-r.ano)<=1));
}
function buscaHTML(){
  const q=filt.q.trim();
  if(!B.ok||LUGAR(filt.cat))return '';
  const alvo=filt.cat==='filme'?'filmes':filt.cat==='serie'?'séries':filt.cat==='jogo'?'jogos':'filmes, séries e jogos';
  if(q.length<2&&B.status!=='ok')return `<div class="busca"><div class="busca-head"><p><b>Não achou o que procura?</b> Digite qualquer título na busca. O M&amp;M encontra ${alvo} já lançados e coloca no catálogo.</p></div></div>`;
  let body='';
  if(B.status==='loading')body=`<p class="note" style="margin:0"><span class="spin"></span> Procurando "${esc(B.q)}"…</p>`;
  else if(B.status==='erro')body=`<p class="err" style="margin:0">${esc(B.msg)}</p>`;
  else if(B.status==='ok'){
    body=B.res.length?B.res.map((r,i)=>{const ex=acharExistente(r);const fake={titulo:r.titulo,cat:r.cat};return `<div class="bres"><div class="mini" style="background:${grad(fake)}"></div>
      <div class="name">${esc(r.titulo)}<div class="sub">${CATS[r.cat].um}${r.ano?' · '+r.ano:''}${r.original&&norm(r.original)!==norm(r.titulo)?' · '+esc(r.original):''}${r.extra?' · '+esc(r.extra):''}</div></div>
      ${ex?`<button class="btn ghost" data-open="${ex.id}">Abrir</button>`:`<button class="btn" data-addres="${i}">Adicionar</button>`}</div>`}).join('')
      :`<p class="note" style="margin:0">Nenhum título lançado encontrado para "${esc(B.q)}". Confira a grafia ou cadastre manualmente.</p>`;
    body+=`<p class="note" style="margin:0">Lançamentos das últimas semanas podem não aparecer. Nesse caso, use <button class="linkish" data-add>Adicionar manualmente</button>.</p>`;
  }
  return `<div class="busca"><div class="busca-head"><p><b>Busca completa</b>Procure em todos os ${alvo} já lançados.</p>
    <button class="btn" data-buscar ${q.length<2||B.status==='loading'?'disabled':''}>${B.status==='loading'?'Buscando…':`Buscar "${esc(q.slice(0,30))}"`}</button></div>${body}</div>`;
}
function drawBusca(){const el=document.getElementById('busca');if(el)el.innerHTML=buscaHTML()}
async function buscarCompleto(){
  const q=filt.q.trim();if(q.length<2||!B.fn)return;
  if(B.ctl)B.ctl.abort();const ctl=new AbortController();B.ctl=ctl;
  B.status='loading';B.q=q;B.res=[];drawBusca();
  const tipos=filt.cat==='filme'?'somente filmes':filt.cat==='serie'?'somente séries (TV ou streaming)':filt.cat==='jogo'?'somente jogos lançados para consoles (PlayStation, Xbox, Nintendo)':'filmes, séries (TV ou streaming) e jogos lançados para consoles';
  const prompt=`Você é o catálogo de um app brasileiro de avaliações. Liste até 8 obras JÁ LANÇADAS que correspondam à busca do usuário, considerando ${tipos}. A busca pode ser um título (em português ou original), parte de um título, um diretor, ator, estúdio ou franquia. Ordene da mais provável para a menos provável. Não invente obras; se não houver correspondência real, responda [].
Responda só com um array JSON neste formato:
[{"cat":"filme","titulo":"título usado no Brasil","original":"título original","ano":2010,"genero":"gênero principal em português","extra":"para filmes: diretor e duração (ex.: Christopher Nolan · 2h28); para séries: número de temporadas; para jogos: plataformas de console"}]
Use "cat" igual a "filme", "serie" ou "jogo".

Busca do usuário: ${q.slice(0,120)}`;
  try{
    const data=await B.fn.json(prompt,{modelTier:'quick',signal:ctl.signal,cache:{gcTime:86400000}});
    if(B.ctl!==ctl)return;
    const arr=Array.isArray(data)?data:[];
    B.res=arr.filter(r=>r&&typeof r.titulo==='string'&&r.titulo.trim()&&['filme','serie','jogo'].includes(r.cat)&&(filt.cat==='todos'||filt.cat===r.cat)).slice(0,8).map(r=>({
      cat:r.cat,titulo:r.titulo.trim().slice(0,120),original:typeof r.original==='string'?r.original.trim().slice(0,120):'',
      ano:Number.isFinite(+r.ano)&&+r.ano>1880&&+r.ano<2100?Math.round(+r.ano):null,
      genero:typeof r.genero==='string'?r.genero.slice(0,60):'',extra:typeof r.extra==='string'?r.extra.slice(0,120):''}));
    B.status='ok';
  }catch(e){
    if(B.ctl!==ctl)return;
    const c=e&&e.code;
    if(c==='cancelled'){B.status='idle'}
    else if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)){B.ok=false;B.status='idle'}
    else{B.status='erro';B.msg=c==='rate_limited'?'Muitas buscas seguidas. Espere um pouco e tente de novo.':c==='session_expired'?'Sua sessão expirou. Entre de novo na sua conta do Claude.':'Não consegui completar a busca. Tente de novo.'}
  }
  drawBusca();
}

function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
function grad(item){
  const base={filme:8,serie:262,academia:152,jogo:218,restaurante:330}[item.cat];
  const h=hash(item.titulo), a=(base+(h%40)-20+360)%360, b=(a+30+(h%50))%360;
  return `linear-gradient(${140+(h%80)}deg, hsl(${a} 62% 40%), hsl(${b} 55% 22%))`;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function stats(id){const rs=allReviews().filter(r=>r.item===id);const avg=rs.length?rs.reduce((a,r)=>a+r.nota,0)/rs.length:null;return{rs,avg}}
function fmt(n){return n==null?'—':n.toFixed(1).replace('.',',')}
function starsHTML(n){let s='';for(let i=1;i<=5;i++){s+= n>=i?STAR:(n>=i-.5?HALF:'')}return `<span class="stars" aria-label="${fmt(n)} de 5 estrelas">${s}</span>`}
function dateBR(d){const [y,m,dd]=d.split('-');return `${dd}/${m}/${y}`}

async function vincularPorCodigo(e){
  e.preventDefault();
  const inp=document.getElementById('fcod'),err=document.getElementById('lerr');
  const falha=t=>{err.textContent=t;err.hidden=false};
  const c=limpaCod(inp.value);
  if(c.length!==6)return falha('O código tem 6 caracteres, como ABC-123.');
  if(c===meuPerfil().codigo)return falha('Esse é o seu próprio código. Digite o código do seu amigo.');
  const u=Object.keys(S.perfis).find(k=>S.perfis[k].codigo===c);
  if(!u)return falha('Nenhuma conta com esse código. Confira com seu amigo se as letras estão certas.');
  const st=statusAmizade(u);
  if(st==='amigo')return falha(`Você e @${S.perfis[u].usuario} já são amigos.`);
  if(st==='enviado')return falha(`Você já enviou um pedido para @${S.perfis[u].usuario}. Agora é com ele.`);
  err.hidden=true;inp.value='';
  await adicionarAmigo(u);
}

function compatBlock(u){

function diaryList(list){

function statsBlock(mine){

/* Detail sheet */
let draft=null;
function openItem(id){
  const it=itemById(id); if(!it) return;
  const mine=myReviews().find(r=>r.item===id);
  draft={item:id,nota:mine?.nota||0,texto:mine?.texto||'',data:mine?.data||hoje(),curtiu:!!mine?.curtiu,revisto:!!mine?.revisto,plat:mine?.plat||'',temp:mine?.temp||'',prato:mine?.prato||'',crit:mine?.crit?{...mine.crit}:(LUGAR(it.cat)?Object.fromEntries(CRIT[it.cat].map(c=>[c,3])):null),spoiler:!!mine?.spoiler,picker:false,editing:mine?.id||null};
  drawSheet();
}
function drawSheet(){
  const it=itemById(draft.item), c=CATS[it.cat], {rs,avg}=stats(it.id);

    <div class="sheet-top">${poster(it,false)}
      <div class="info">
        <div class="eyebrow" style="color:${c.cor}">${c.um}${it.exemplo?' · exemplo':''}</div>
        <h2>${esc(it.titulo)}</h2>
        <div class="facts">${it.original&&norm(it.original)!==norm(it.titulo)?`<span class="fact">${esc(it.original)}</span>`:''}${it.ano?`<span class="fact">${it.ano}</span>`:''}${it.genero?`<span class="fact">${esc(it.genero)}</span>`:''}${it.extra?`<span class="fact">${esc(it.extra)}</span>`:''}</div>
        ${acoesItem(it)}
        <div class="big-score"><span class="n">${fmt(avg)}</span><div><div>${avg!=null?starsHTML(avg):''}</div><div class="of">${rs.length} ${rs.length===1?'avaliação':'avaliações'}</div></div>
          <div class="dist" aria-label="Distribuição das notas de meia a cinco estrelas">${buckets.map((b,i)=>`<div class="${b===mx&&b>0?'hot':''}" style="height:${b/mx*100}%" title="${(i+1)/2} estrelas: ${b}"></div>`).join('')}</div>
        </div>
      </div>
    </div>
    ${critAvg?`<div class="panel"><h3>Por critério</h3>${critAvg}</div>`:''}

      ${LUGAR(it.cat)?`<div class="crit">${CRIT[it.cat].map((k,i)=>`<label for="cr-${i}"><span class="row">${k}<span id="cv-${i}">${fmt(draft.crit[k]??3)}</span></span><input type="range" id="cr-${i}" min="1" max="5" step=".5" value="${draft.crit[k]??3}" data-crit="${k}" data-ci="${i}"></label>`).join('')}</div>`:''}
      <div class="form-row">
        <label class="field" for="fdata">Data<input type="date" id="fdata" value="${draft.data}"></label>
        ${it.cat==='jogo'?`<label class="field" for="fplat">Plataforma<select id="fplat"><option value="">Escolha</option>${PLATS.map(p=>`<option${draft.plat===p?' selected':''}>${p}</option>`).join('')}</select></label>`:''}
        ${it.cat==='restaurante'?`<label class="field" for="fprato">O que você pediu<input id="fprato" maxlength="80" placeholder="Ex.: Feijoada, rodízio, hambúrguer da casa" value="${esc(draft.prato)}"></label>`:''}
        ${it.cat==='serie'?`<label class="field" for="ftemp">Temporada<input id="ftemp" inputmode="numeric" placeholder="Ex.: 2" value="${esc(draft.temp)}"></label>`:''}
      </div>
      <label class="field" for="ftexto">Resenha<textarea id="ftexto" placeholder="${it.cat==='restaurante'?'Como estava a comida? Vale o preço? Fila, ambiente, atendimento…':it.cat==='academia'?'Como foi o treino? Horário, equipamentos, professores…':it.cat==='jogo'?'Zerou? Platinou? O que achou do gameplay?':'O que ficou com você depois?'}">${esc(draft.texto)}</textarea></label>

        <button type="button" class="toggle" id="spoil" aria-pressed="${draft.spoiler}">Contém spoiler</button>
      </div>
      <div class="err" id="ferr" hidden>Escolha uma nota de meia a cinco estrelas antes de salvar.</div>
      <div class="actions">${draft.editing?'<button type="button" class="btn ghost" id="del">Excluir avaliação</button>':''}<button type="submit" class="btn">Salvar avaliação</button></div>
    </form>
    <div class="reviews"><h3>Avaliações (${rs.length})</h3>
      ${rs.length?rs.slice().sort((a,b)=>b.data.localeCompare(a.data)).map(r=>`<div class="rv"><div class="who" style="display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap"><span class="avatar" style="background:${esc(r.cor||'var(--accent)')}">${esc(inicial(r.autor))}</span>${r.uid?`<button class="linkish" data-perfil="${esc(r.uid)}">${esc(r.autor)}</button>`:`<b style="color:var(--ink)">${esc(r.autor)}</b>`} ${starsHTML(r.nota)} · ${dateBR(r.data)} ${r.exemplo?'<span class="ex">exemplo</span>':''}</div>${textoResenha(r)}${socialResenha(r)}</div>`).join(''):'<p class="note">Ninguém avaliou ainda. A primeira nota é sua.</p>'}
    </div>
  </div></div>`;
  bindSheet();
}
function painelAmigos(it){
  const am=amigos();if(!am.length)return '';
  const rs=am.filter(u=>S.avals[u]&&S.avals[u][it.id]).map(u=>({u,r:S.avals[u][it.id],p:S.perfis[u]}));
  const meu=(S.avals[S.uid]||{})[it.id];
  if(!rs.length)return `<div class="panel fr-panel"><h3>O que seus amigos acharam</h3><p class="note" style="margin:0">Nenhum amigo avaliou ${esc(it.titulo)} ainda.</p></div>`;
  const media=rs.reduce((s,x)=>s+x.r.nota,0)/rs.length;
  return `<div class="panel fr-panel"><h3>O que seus amigos acharam <span class="note" style="font-weight:400">· média ${fmt(media)}${meu?` · você deu ${fmt(meu.nota)}`:''}</span></h3>
    <div>${rs.map(x=>`<div class="frv"><span class="avatar" style="background:${esc(x.p.cor)}">${esc(inicial(x.p.usuario))}</span><div><button class="linkish" data-perfil="${esc(x.u)}">@${esc(x.p.usuario)}</button> ${starsHTML(x.r.nota)}${x.r.curtiu?' <span style="color:var(--accent);display:inline-flex;width:14px;vertical-align:-2px">'+HEART+'</span>':''}${x.r.plat?` <span class="note">· ${esc(x.r.plat)}</span>`:''}${x.r.prato?` <span class="note">· pediu ${esc(x.r.prato)}</span>`:''}${x.r.texto?`<p>${esc(x.r.texto)}</p>`:''}</div></div>`).join('')}</div></div>`;
}
function syncDraft(){
  const g=id=>document.getElementById(id);
  if(g('ftexto')) draft.texto=g('ftexto').value;
  if(g('fdata')) draft.data=g('fdata').value||draft.data;
  if(g('fplat')) draft.plat=g('fplat').value;
  if(g('ftemp')) draft.temp=g('ftemp').value;
  if(g('fprato')) draft.prato=g('fprato').value.trim().slice(0,80);
}
function bindSheet(){
  const m=document.getElementById('modal');
  m.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{syncDraft();draft.nota=+b.dataset.n;const st=m.querySelector('.sheet').scrollTop;drawSheet();m.querySelector('.sheet').scrollTop=st});
  m.querySelectorAll('[data-crit]').forEach(r=>r.oninput=()=>{draft.crit[r.dataset.crit]=+r.value;document.getElementById('cv-'+r.dataset.ci).textContent=fmt(+r.value)});
  document.getElementById('like').onclick=e=>{draft.curtiu=!draft.curtiu;e.currentTarget.setAttribute('aria-pressed',draft.curtiu)};
  document.getElementById('again').onclick=e=>{draft.revisto=!draft.revisto;e.currentTarget.setAttribute('aria-pressed',draft.revisto)};
  document.getElementById('spoil').onclick=e=>{draft.spoiler=!draft.spoiler;e.currentTarget.setAttribute('aria-pressed',draft.spoiler)};
  const del=document.getElementById('del'); if(del) del.onclick=()=>{
    if(del.dataset.confirm){const item=draft.item;closeSheet();deleteReview(item).then(ok=>{render();if(ok)toast('Avaliação excluída')})}
    else{del.dataset.confirm='1';del.textContent='Toque de novo para excluir'}
  };
  document.getElementById('rf').onsubmit=e=>{
    e.preventDefault();syncDraft();
    if(!draft.nota){document.getElementById('ferr').hidden=false;return}
    const rec={id:'r'+Date.now(),item:draft.item,autor:'Você',cor:'var(--accent)',nota:draft.nota,texto:draft.texto.trim().slice(0,4000),data:draft.data,curtiu:draft.curtiu,revisto:draft.revisto,plat:draft.plat,temp:draft.temp,prato:draft.prato,spoiler:draft.spoiler,crit:draft.crit};
    if(S.mode==='conta'&&!temConta()){S.pendente=rec;closeSheet();openConta();toast('Crie sua conta para salvar a avaliação');return}
    closeSheet();
    saveReview(rec).then(ok=>{if(ok)tirarDaWatch(rec.item);render();if(ok)toast(temConta()?'Avaliação salva na sua conta':'Avaliação salva neste navegador')});
  };
}
function closeSheet(){document.getElementById('modal').innerHTML='';draft=null}

let tt;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-open],[data-go],[data-cat],[data-chip],[data-close],[data-add],[data-perfil],[data-conta],[data-buscar],[data-addres],[data-copiar],[data-aceitar],[data-ignorar],[data-remover],[data-watch],[data-fav],[data-picker],[data-lt],[data-curtir],[data-coment],[data-revelar],[data-apagarcom],[data-aba],[data-lista],[data-voltarperfil],[data-favrm],[data-listarm],[data-listadel],#addBtn,#addTab');
  if(e.target.id==='scrim'){closeSheet();return}
  if(!t) return;
  if(t.dataset.copiar){const p=meuPerfil();if(!p||!p.codigo)return;const c=fmtCod(p.codigo);
    if(t.dataset.copiar==='cod')copiar(c,'Código copiado');else copiar(`Me adiciona no M&M para a gente ver as avaliações um do outro de filmes, séries, academias, jogos e restaurantes! Meu código de amizade: ${c}`,'Convite copiado. Cole no WhatsApp ou onde preferir.')}
  else if(t.dataset.aceitar){adicionarAmigo(t.dataset.aceitar)}
  else if(t.dataset.ignorar){ignorarPedido(t.dataset.ignorar).then(ok=>ok&&toast('Pedido recusado'))}
  else if(t.dataset.remover){const u=t.dataset.remover;if(t.dataset.confirm){removerAmigo(u).then(ok=>ok&&toast('Removido dos amigos'))}else{t.dataset.confirm='1';t.textContent='Confirmar'}}
  else if('buscar' in t.dataset){buscarCompleto()}
  else if(t.dataset.addres!=null){adicionarResultado(+t.dataset.addres)}
  else if(t.dataset.perfil){S.perfilVer=t.dataset.perfil;S.perfilAba='diario';closeSheet();go('perfil')}
  else if('conta' in t.dataset){openConta()}
  else if(t.dataset.open){openItem(t.dataset.open)}
  else if(t.dataset.go){if(t.dataset.go==='perfil')S.perfilVer=null;closeSheet();go(t.dataset.go)}
  else if(t.dataset.cat){filt.cat=t.dataset.cat;go('explorar')}
  else if(t.dataset.chip){filt.cat=t.dataset.chip;render()}
  else if('close' in t.dataset){closeSheet()}
  else if('add' in t.dataset){openAdd(filt.q)}
  else if(t.id==='addBtn'||t.id==='addTab'){openAdd('')}
  else if(t.dataset.watch){toggleWatch(t.dataset.watch)}
  else if(t.dataset.fav){toggleFav(t.dataset.fav)}
  else if(t.dataset.favrm){toggleFav(t.dataset.favrm)}
  else if('picker' in t.dataset){if(draft){draft.picker=!draft.picker;redrawSheet()}}
  else if(t.dataset.lt){if(draft)toggleNaLista(t.dataset.lt,draft.item)}
  else if(t.dataset.curtir){toggleCurtida(t.dataset.curtir)}
  else if(t.dataset.coment){const k=t.dataset.coment;if(S.abertos.has(k))S.abertos.delete(k);else S.abertos.add(k);redrawSheet()}
  else if(t.dataset.revelar){S.revelados.add(t.dataset.revelar);redrawSheet()}
  else if(t.dataset.apagarcom){apagarComentario(t.dataset.apagarcom)}
  else if(t.dataset.aba){S.perfilAba=t.dataset.aba;render()}
  else if(t.dataset.lista){const i=t.dataset.lista.indexOf('|');S.listaVer={uid:t.dataset.lista.slice(0,i),id:t.dataset.lista.slice(i+1)};go('lista')}
  else if('voltarperfil' in t.dataset){const u=S.listaVer?.uid;S.perfilVer=(!u||u==='local'||u===S.uid)?null:u;S.perfilAba='listas';go('perfil')}
  else if(t.dataset.listarm){if(S.listaVer)toggleNaLista(S.listaVer.id,t.dataset.listarm)}
  else if(t.dataset.listadel){if(t.dataset.confirm)excluirLista(t.dataset.listadel);else{t.dataset.confirm='1';t.textContent='Toque de novo para excluir'}}
});
document.addEventListener('submit',e=>{
  const f=e.target;if(!f||!f.dataset)return;
  if(f.dataset.comform){e.preventDefault();const t=f.elements.t.value.trim();if(t)comentar(f.dataset.comform,t)}
  else if('novalista' in f.dataset){e.preventDefault();const n=f.elements.nome.value.trim();if(!n){toast('Dê um nome para a lista');return}f.elements.nome.value='';f.elements.nome.blur();criarLista(n,f.dataset.novalista==='perfil'?null:(draft&&draft.item))}
  else if(f.dataset.editlista){e.preventDefault();editarLista(f.dataset.editlista,f.elements.nome.value.trim(),f.elements.desc.value.trim())}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modal').innerHTML)closeSheet()});
init();
</script>

</body></html>
